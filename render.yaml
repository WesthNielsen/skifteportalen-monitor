services:
  - type: cron
    name: skifteportalen-spec-monitor
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 7 * * *"
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bun run start
    envVars:
      - key: BUN_VERSION
        value: 1.4.2
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: STATE_KEY
        value: skifteportalen:monitor:v1
