openapi: 3.0.3
info:
  title: Api til dødsbojournaler
  description: Api til at anmelde, opdatere, slette og vise krav, tilgodehavender,
    forespørgsler og effektfortegnelser for en dødsbojournal.
  version: 4.10.0
servers:
- url: https://api.domstol.dk
- url: https://api.test-minskiftesag.net
paths:
  /doedsbojournaler:
    post:
      summary: Hent liste af dødsbojournaler.
      description: Dette kald giver mulighed for at fremsøge en dødbojournaler baseret
        på enten CPR-nr. eller navn og adresse.
      tags:
      - doedsbojournal
      operationId: searchBo
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalQuery'
      responses:
        '200':
          description: Liste af dødsbojournaler som lever op til kriterierne.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournal'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler:
    post:
      summary: Hent liste af dødsbojournaler.
      description: Dette kald giver mulighed for at fremsøge en dødbojournaler baseret
        på enten CPR-nr. eller navn og adresse.
      tags:
      - doedsbojournal
      operationId: searchBoV2
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalQuery'
      responses:
        '200':
          description: Liste af dødsbojournaler som lever op til kriterierne.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournalV2'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/aendringer:
    post:
      summary: Hent liste af ændrede dødsbojournaler.
      description: Dette kald giver mulighed for at fremsøge dødsbojournaler som er
        ændret siden | et angivet tidspunkt. I praksis foregår det ved at der sendes
        en liste af doedsbojournalId'er samt et | et tidspunkt. Svaret er en liste
        af dødsbojournaler som er ændret siden det angivne tidspunkt.
      tags:
      - doedsbojournal
      operationId: findChangedSince
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalAendringer'
      responses:
        '200':
          description: Liste af dødsbojournaler som er ændret fra den angivne dato
            og frem.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournal'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/aendringer:
    post:
      summary: Hent liste af ændrede dødsbojournaler.
      description: Dette kald giver mulighed for at fremsøge dødsbojournaler som er
        ændret siden | et angivet tidspunkt. I praksis foregår det ved at der sendes
        en liste af doedsbojournalId'er samt et | et tidspunkt. Svaret er en liste
        af dødsbojournaler som er ændret siden det angivne tidspunkt.
      tags:
      - doedsbojournal
      operationId: findChangedSinceV2
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalAendringer'
      responses:
        '200':
          description: Liste af dødsbojournaler som er ændret fra den angivne dato
            og frem.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournalV2'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/aendringerKontaktperson:
    post:
      summary: Hent liste af ændrede dødsbojournaler som kontaktperson.
      description: Dette kald giver mulighed for at fremsøge dødsbojournaler, som
        brugeren selv er kontaktperson for | eller bobehandler på. Svaret er en liste
        af dødsbojournaler som er ændret | siden det angivne tidspunkt.
      tags:
      - doedsbojournal
      operationId: findChangedSinceForKontaktperson
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalAendringerKontaktperson'
      responses:
        '200':
          description: Liste af dødsbojournaler som er ændret fra den angivne dato
            og frem.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournal'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/aendringerKontaktperson:
    post:
      summary: Hent liste af ændrede dødsbojournaler som kontaktperson.
      description: Dette kald giver mulighed for at fremsøge dødsbojournaler, som
        brugeren selv er kontaktperson for | eller bobehandler på. Svaret er en liste
        af dødsbojournaler som er ændret | siden det angivne tidspunkt.
      tags:
      - doedsbojournal
      operationId: findChangedSinceForKontaktpersonV2
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalAendringerKontaktperson'
      responses:
        '200':
          description: Liste af dødsbojournaler som er ændret fra den angivne dato
            og frem.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournalV2'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/registreringer:
    post:
      summary: Hent liste af registering id'er tilhørende indberetter.
      operationId: getRegistreringIdList
      tags:
      - doedsbojournal
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      requestBody:
        required: true
        description: Hent alle registrerings-ID'er uden at specificere nogen start-
          eller slutdato. | Specificér startdatoen for at hente registrerings-ID'er,
          der er oprettet/redigeret, fra startdatoen og indtil nu. | Specificér slutdatoen
          for at hente registrerings-ID'er, der er oprettet/redigeret, fra nu og indtil
          slutdatoen. | Specificér startdatoen og slutdatoen for at hente registrerings-ID'er,
          der er oprettet/redigeret, fra startdatoen og indtil slutdatoen.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/registreringQuery'
      responses:
        '200':
          description: Liste af registering id'er tilhørende indberetter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/registrering'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/opdateringAfKontaktpersonensDetaljerForVirksomhed:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    post:
      tags:
      - doedsbojournal
      operationId: updateKontaktpersonDetaljerVirksomhed
      summary: Opdater detaljer om virksomheden, som er kontaktperson for dødsboet.
      description: Dette kald giver en virksomhed, som er kontaktperson på dødsboet,
        mulighed for at ændre detaljer for virksomheden. | Herunder telefonnummer,
        email adresse, anden adresse, c/o adresse og virksomhedens reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kontaktpersonVirksomhedOpdatering'
      responses:
        '201':
          description: Svar på opdateringen af kontaktpersonens detaljer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kontaktperson'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/opdateringAfKontaktpersonensDetaljerPerson:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    post:
      tags:
      - doedsbojournal
      operationId: updateKontaktpersonDetaljerPerson
      summary: Opdater detaljer om personen, som er kontaktperson for dødsboet.
      description: Dette kald giver en person, som er kontaktperson på dødsboet, mulighed
        for at ændre kontakoplysninger. | Det er kun muligt at ændre email og telefonnummer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kontaktoplysninger'
      responses:
        '201':
          description: Svar på opdateringen af kontaktpersonens detaljer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kontaktperson'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    get:
      summary: Hent metadata om en dødsbojournal.
      tags:
      - doedsbojournal
      operationId: getDoedsbo
      responses:
        '200':
          description: Metadata om en dødsbojournal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/doedsbojournal'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/registreringer:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    get:
      tags:
      - doedsbojournal
      operationId: getRegistreringerForBruger
      summary: Hent brugerens registreringer på én dødsbojournal.
      description: Henter samlet de krav, tilgodehavender og forespørgsler på den
        angivne dødsbojournal, som den autentificerede bruger har adgang til. Svaret
        svarer til at kalde /krav, /tilgodehavender og /forespoergsler hver for sig.
      responses:
        '200':
          description: Krav, tilgodehavender og forespørgsler på den angivne dødsbojournal,
            som brugeren har adgang til.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/registreringerForBruger'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/{doedsbojournalId}:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    get:
      summary: Hent metadata om en dødsbojournal.
      tags:
      - doedsbojournal
      operationId: getDoedsboV2
      responses:
        '200':
          description: Metadata om en dødsbojournal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/doedsbojournalV2'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/krav:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    get:
      tags:
      - doedsbojournal
      operationId: getAllKrav
      summary: Hent liste af krav for en dødsbojournal.
      responses:
        '200':
          description: Liste af anmeldte krav for dødsbojournalen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/krav'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    post:
      tags:
      - doedsbojournal
      operationId: addKrav
      summary: Anmeld krav til en dødsbojournal.
      deprecated: true
      description: Dette er ikke den nyeste version af dette endepunkt. Dette endepunkt
        vil være supporteret til og med 11-12-2024, og vil blive lukket ved første
        release efter denne dato. Brug derfor det nye endepunkt </v2/doedsbojournaler/{doedsbojournalId}/krav>
        i stedet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kravOpdatering'
      responses:
        '201':
          description: Svar på anmeldelse af krav.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/krav'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/personValidering:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    post:
      tags:
      - doedsbojournal
      operationId: isValidPerson
      summary: Tjekker om person med det angivne CPR-nummer og navn findes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/person'
      responses:
        '200':
          description: Hvis personen med det angivne CPR-nummer og navn findes.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/{doedsbojournalId}/krav:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    post:
      tags:
      - doedsbojournal
      operationId: addKravV2
      summary: Anmeld krav til en dødsbojournal.
      description: I denne opdaterede version er det ikke længere muligt at oprette
        på vegne af en anden med dansk adresse uden CPR-nummer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kravOpdatering'
      responses:
        '201':
          description: Svar på anmeldelse af krav.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/krav'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/krav/{kravId}:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    - $ref: '#/components/parameters/kravId'
    get:
      summary: Hent specifikt krav for dødsbojournal.
      tags:
      - doedsbojournal
      operationId: getKrav
      responses:
        '200':
          description: Krav fra dødsbojournal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/krav'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    put:
      tags:
      - doedsbojournal
      summary: Opdater krav for dødsbojournal.
      operationId: updateKrav
      deprecated: true
      description: Dette er ikke den nyeste version af dette endepunkt. Dette endepunkt
        vil være supporteret til og med 11-12-2024, og vil blive lukket ved første
        release efter denne dato. Brug derfor det nye endepunkt </v2/doedsbojournaler/{doedsbojournalId}/krav/{kravId}>
        i stedet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kravOpdatering'
      responses:
        '200':
          description: Svar på opdatering af krav for dødsbojournal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/krav'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    delete:
      tags:
      - doedsbojournal
      summary: Slet krav for dødsbojournal.
      operationId: deleteKrav
      responses:
        '200':
          description: Svar på sletning af krav for dødsbojournal.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/{doedsbojournalId}/krav/{kravId}:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    - $ref: '#/components/parameters/kravId'
    put:
      tags:
      - doedsbojournal
      summary: Opdater krav for dødsbojournal.
      description: I denne opdaterede version er det ikke længere muligt at oprette
        på vegne af en anden med dansk adresse uden CPR-nummer.
      operationId: updateKravV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kravOpdatering'
      responses:
        '200':
          description: Svar på opdatering af krav for dødsbojournal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/krav'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/krav/{kravId}/bilag:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    - $ref: '#/components/parameters/kravId'
    get:
      tags:
      - doedsbojournal
      operationId: getAllBilagForKrav
      summary: Hent alle bilag for et givent krav.
      responses:
        '200':
          $ref: '#/components/responses/hentListAfBilagResponse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    post:
      tags:
      - doedsbojournal
      operationId: addBilagToKrav
      summary: Tilknyt bilag til krav.
      parameters:
      - in: header
        required: true
        name: Content-Disposition
        schema:
          $ref: '#/components/schemas/bilagNavn'
      requestBody:
        $ref: '#/components/requestBodies/tilknytBilagRequest'
      responses:
        '201':
          $ref: '#/components/responses/bilagTilknyttetResponse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/krav/{kravId}/bilag/{bilagId}:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    - $ref: '#/components/parameters/kravId'
    - $ref: '#/components/parameters/bilagId'
    get:
      tags:
      - doedsbojournal
      operationId: getBilagForKrav
      summary: Hent specifikt bilag for et krav.
      responses:
        '200':
          $ref: '#/components/responses/hentBilagResponse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    delete:
      tags:
      - doedsbojournal
      operationId: deleteBilagForKrav
      summary: Slet et bilag.
      responses:
        '200':
          $ref: '#/components/responses/bilagSlettetResponse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/tilgodehavender:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    get:
      tags:
      - doedsbojournal
      operationId: getAllTilgodehavender
      summary: Hent liste af tilgodehavender for dødsbojournal.
      responses:
        '200':
          description: Viser en liste af tilgodehavender.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/tilgodehavende'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    post:
      tags:
      - doedsbojournal
      summary: Anmeld tilgodehavende til dødsbojournal.
      operationId: addTilgodehavende
      deprecated: true
      description: Dette er ikke den nyeste version af dette endepunkt. Dette endepunkt
        vil være supporteret til og med 11-12-2024, og vil blive lukket ved første
        release efter denne dato. Brug derfor det nye endepunkt </v2/doedsbojournaler/{doedsbojournalId}/tilgodehavender>
        i stedet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tilgodehavendeOpdatering'
      responses:
        '201':
          description: Svar på anmeldelse af krav.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tilgodehavende'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/{doedsbojournalId}/tilgodehavender:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    post:
      tags:
      - doedsbojournal
      summary: Anmeld tilgodehavende til dødsbojournal.
      description: I denne opdaterede version er det ikke længere muligt at oprette
        på vegne af en anden med dansk adresse uden CPR-nummer.
      operationId: addTilgodehavendeV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tilgodehavendeOpdatering'
      responses:
        '201':
          description: Svar på anmeldelse af krav.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tilgodehavende'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbojournaler/{doedsbojournalId}/tilgodehavender/{tilgodehavendeId}:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    - $ref: '#/components/parameters/tilgodehavendeId'
    get:
      tags:
      - doedsbojournal
      summary: Hent specifikt tilgodehavende for dødsbojournal.
      operationId: getTilgodehavende
      responses:
        '200':
          description: Tilgodenhavende for dødsbojournal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tilgodehavende'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    put:
      tags:
      - doedsbojournal
      summary: Opdater tilgodehavende for dødsbojournal.
      operationId: updateTilgodehavende
      deprecated: true
      description: Dette er ikke den nyeste version af dette endepunkt. Dette endepunkt
        vil være supporteret til og med 11-12-2024, og vil blive lukket ved første
        release efter denne dato. Brug derfor det nye endepunkt </v2/doedsbojournaler/{doedsbojournalId}/tilgodehavender/{tilgodehavendeId}>
        i stedet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tilgodehavendeOpdatering'
      responses:
        '200':
          description: Svar på opdatering af tilgodehavende for dødsbojournal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tilgodehavende'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    delete:
      tags:
      - doedsbojournal
      summary: Slet tilgodehavende for dødsbojournal.
      operationId: deleteTilgodehavende
      responses:
        '200':
          description: Svar på sletning af tilgodehavende for dædsbojournal.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/{doedsbojournalId}/tilgodehavender/{tilgodehavendeId}:
    parameters:
    - $ref: '#/components/parameters/doedsbojournalId'
    - $ref: '#/components/parameters/tilgodehavendeId'
    put:
      tags:
      - doedsbojournal
      summary: Opdater tilgodehavende for dødsbojournal.
