    fritekstadresse:
      description: Danske eller udenlandsk adresse i fritekstform.
      x-namespace: dk.domstol.oas.common.adressev2
      required:
      - adresselinje1
      properties:
        adresselinje1:
          type: string
          maxLength: 200
        adresselinje2:
          type: string
          maxLength: 200
        adresselinje3:
          type: string
          maxLength: 200
        adresselinje4:
          type: string
          maxLength: 200
        adresselinje5:
          type: string
          maxLength: 200
        landekode:
          $ref: '#/components/schemas/landekodeEnum'
    partTypeEnum:
      x-namespace: dk.domstol.oas.common
      description: Type af part. Person givet ved CPR-nummer, virksomhed givet ved
        CVR-nummer eller udenlandsk virksomhed eller person.
      type: string
      enum:
      - PERSON
      - VIRKSOMHED
      - UDENLANDSK
    part:
      x-namespace: dk.domstol.oas.common
      description: Part givet ved typen (person, virksomhed eller udenlandsk) og de
        tilhørende underelementer for typen.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/partTypeEnum'
        virksomhed:
          $ref: '#/components/schemas/virksomhedReference'
        person:
          $ref: '#/components/schemas/personReference'
        udenlandsk:
          $ref: '#/components/schemas/fritekstPart'
    personReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til person som har og kan identificeres med et CPR-nr.
      required:
      - personId
      properties:
        personId:
          $ref: '#/components/schemas/id'
    virksomhedReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til virksomhed.
      required:
      - cvrNummer
      properties:
        cvrNummer:
          $ref: '#/components/schemas/cvrNummer'
    fritekstPart:
      x-namespace: dk.domstol.oas.common
      description: Fritekst part (person) givet ved et navn og en adresse. Benyttes
        når personen ikke har et CPR-nr.
      required:
      - navn
      - adresse
      properties:
        navn:
          type: string
          maxLength: 200
        adresse:
          $ref: '#/components/schemas/fritekstadresse'
    partnerReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til partner med et partnerId i partner registeret.
      required:
      - partnerId
      properties:
        partnerId:
          $ref: '#/components/schemas/id'
    systemPart:
      required:
      - name
      properties:
        name:
          type: string
    tvangsoploesningAarsag:
      x-namespace: dk.domstol.oas.common.insolvens
      type: string
      enum:
      - MANGLENDE_REGNSKAB
      - OEVRIGE
    aarsag:
      x-namespace: dk.domstol.oas.common.insolvens
      type: object
      required:
      - type
      - tekst
      properties:
        type:
          $ref: '#/components/schemas/tvangsoploesningAarsag'
        tekst:
          type: string
    ledelsesmedlem:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Data for et tidligere ledelsesmedlem i en insolvens-sag.
      required:
      - part
      - hemmeligAdresse
      properties:
        part:
          $ref: '#/components/schemas/part'
        relationInformation:
          $ref: '#/components/schemas/ledelsesmedlemInformation'
        kontaktoplysninger:
          $ref: '#/components/schemas/kontaktoplysninger'
        hemmeligAdresse:
          type: boolean
          description: Angiver om adressen er hemmelig, skal angives når seneste ledelse
            er udenlandsk. Ellers altid false.
    tvangsoploesningDokumentType:
      x-namespace: dk.domstol.oas.common.insolvens
      type: string
      enum:
      - ANMODNING_OM_OPLOESNING
      - ANMODNING_OM_FRISTUDSAETTELSE
      - OPLOESNINGSTRUSSEL
      - ERKLAERING
      - RETSBOG
      - INHABILITETSERKLAERING
      - OEVRIGE
      - VURDERINGDATA
      example: ANMODNING_OM_OPLOESNING
    dokumentReference:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Reference til dokument i dokumentlageret.
      required:
      - id
      properties:
        id:
          description: Teknisk ID for dokumentet, nogle steder refereret til som dokument
            referencen.
          type: string
          format: uuid
    tvangsoploesningDokument:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Dokument relateret til insolvens.
      required:
      - reference
      - type
      properties:
        reference:
          $ref: '#/components/schemas/dokumentReference'
        type:
          $ref: '#/components/schemas/tvangsoploesningDokumentType'
    ledelsesmedlemInformation:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Information om det tidligere ledelsesmedlems relation til selskabet
        under tvangsopløsning/konkurs.
      properties:
        tiltraadt:
          type: string
          format: date
        fratraadt:
          type: string
          format: date
        kontaktadresser:
          type: array
          items:
            $ref: '#/components/schemas/fritekstadresse'
    meddelelse:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Meddelelse på sagen, dette værende et dokument der er sendt imellem
        parter på sagen.
      required:
      - reference
      properties:
        reference:
          $ref: '#/components/schemas/dokumentReference'
    kontaktoplysninger:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Kontaktoplysninger (email adresse og/eller telefonnummer) for en
        person eller virksomhed.
