openapi: 3.0.3
info:
  title: Api til virksomhed.
  description: Api til at hente stamdata om virksomheder.
  version: 1.3.0
servers:
- url: http://localhost:8080
paths:
  /virksomheder/{cvrNummer}:
    parameters:
    - $ref: '#/components/parameters/cvrNummerParameter'
    get:
      deprecated: true
      tags:
      - virksomhed
      operationId: getVirksomhed
      summary: Hent virksomhed med cvrnummer.
      responses:
        '200':
          description: Information om virksomheden med CVR-nummer. Dette endpoint
            er deprecated og v2 bør benyttes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/virksomhed'
          links:
            self:
              operationId: hentVirksomhed
              parameters:
                cvrNummer: $request.path.cvrNummer
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/virksomheder/{cvrNummer}:
    parameters:
    - $ref: '#/components/parameters/cvrNummerParameter'
    get:
      tags:
      - virksomhed
      operationId: getCvrVirksomhed
      summary: Hent virksomhed med cvrnummer.
      responses:
        '200':
          description: Information om virksomheden med CVR-nummer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cvrVirksomhed'
          links:
            self:
              operationId: hentVirksomhed
              parameters:
                cvrNummer: $request.path.cvrNummer
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /virksomheder/{cvrNummer}/retskredskode:
    parameters:
    - $ref: '#/components/parameters/cvrNummerParameter'
    get:
      tags:
      - virksomhed
      operationId: getRetskredskodeForVirksomhed
      summary: Hent retkredskoden for virksomhed med cvrnummer baseret på virksomhedens
        adresse.
      responses:
        '200':
          description: Retskredskoden for retskredsen som virksomheden hører til.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retskredsinfo'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /virksomheder/{cvrNummer}/detaljeretAdresse:
    parameters:
    - $ref: '#/components/parameters/cvrNummerParameter'
    get:
      tags:
      - virksomhed
      operationId: getDetaljeretDanskAdresseByCvrNummer
      summary: Finder detaljeret dansk adresse for virksomhed med det angivne cvr.
      responses:
        '200':
          description: Detaljeret adresse på virksomhed med det angivne cvr returneres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/detaljeretDanskAdresse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
security:
- bearerAuth: [
    ]
components:
  parameters:
    cvrNummerParameter:
      name: cvrNummer
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/cvrNummer'
      description: Virksomhedens CVR-nummer.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    virksomhed:
      deprecated: true
      properties:
        adresse:
          $ref: '#/components/schemas/darAdresse'
        cvrnummer:
          $ref: '#/components/schemas/cvrNummer'
        navn:
          type: string
        reklamebeskyttet:
          type: boolean
      required:
      - cvrnummer
      - navn
    cvrVirksomhed:
      required:
      - adresse
      - cvrnummer
      - navn
      properties:
        adresse:
          $ref: '#/components/schemas/adresse'
        cvrnummer:
          $ref: '#/components/schemas/cvrNummer'
        navn:
          type: string
        reklamebeskyttet:
          type: boolean
    retskredsinfo:
      required:
      - retskredskode
      properties:
        retskredskode:
          type: string
    id:
      type: string
      format: uuid
    cvrNummer:
      type: string
      pattern: ^[1-9][0-9]{7}$
    retskredsId:
      description: Unikt ID for en given retskreds, der kan anvendes til identificering
        af en specifik retskreds i retskreds-service.
      type: string
      pattern: ^\d{4}$
    directionEnum:
      x-namespace: dk.domstol.oas.common
      type: string
      enum:
      - ASC
      - DESC
    darAdresse:
      deprecated: true
      x-namespace: dk.domstol.oas.common
      description: Repræsentation af adresse fra Dansk Adresse Register (DAR).
      required:
      - id
      - adresselinje
      - postnummer
      - by
