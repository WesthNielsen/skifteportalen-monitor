        adressetype:
          $ref: '#/components/schemas/adressetype'
    adressetype:
      x-namespace: dk.domstol.oas.common.adressev2
      type: string
      enum:
      - STRUKTURERET_DANSK_ADRESSE
      - FRITEKSTADRESSE
      - INGEN_ADRESSE
      - null
    detaljeretDanskAdresse:
