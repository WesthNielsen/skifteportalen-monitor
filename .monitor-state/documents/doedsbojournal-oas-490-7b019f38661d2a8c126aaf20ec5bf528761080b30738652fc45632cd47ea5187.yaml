    get:
      tags:
        - doedsbojournal
      operationId: getRegistreringerForBruger
      summary: Hent brugerens registreringer på én dødsbojournal.
      description: Henter samlet de krav, tilgodehavender og forespørgsler på den angivne dødsbojournal, som den autentificerede bruger har adgang til. Svaret svarer til at kalde /krav, /tilgodehavender og /forespoergsler hver for sig.
      responses:
        '200':
          description: Krav, tilgodehavender og forespørgsler på den angivne dødsbojournal, som brugeren har adgang til.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/registreringerForBruger'
        default:
          $ref: './imported/apiErrors/apiErrors.yaml#/components/responses/genericErrorResponse'

  /v2/doedsbojournaler/{doedsbojournalId}:
