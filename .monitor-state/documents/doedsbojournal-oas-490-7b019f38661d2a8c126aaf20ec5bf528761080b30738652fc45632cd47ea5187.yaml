      operationId: updateKontaktpersonDetaljerPerson
      summary: Opdater detaljer om personen, som er kontaktperson for dødsboet.
      description: Dette kald giver en person, som er kontaktperson på dødsboet, mulighed for at ændre kontakoplysninger. |
        Det er kun muligt at ændre email og telefonnummer.
      requestBody:
        required: true
        content:
