openapi: 3.0.3
info:
  title: Api til dødsbojournaler
  description: Api til at anmelde, opdatere, slette og vise krav, tilgodehavender, forespørgsler og effektfortegnelser for en dødsbojournal.
  version: 4.9.0
servers:
  - url: 'https://api.domstol.dk'
  - url: 'https://api.test-minskiftesag.net'
paths:
  /doedsbojournaler:
    post:
      summary: Hent liste af dødsbojournaler.
      description: Dette kald giver mulighed for at fremsøge en dødbojournaler baseret på enten CPR-nr. eller navn og adresse.
      tags:
        - doedsbojournal
      operationId: searchBo
      parameters:
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/page'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/size'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/sort'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/direction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalQuery'
      responses:
        '200':
          description: Liste af dødsbojournaler som lever op til kriterierne.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournal'
          headers:
            'X-Total-Count':
              $ref: './imported/pagination/pagination.yaml#/components/headers/totalCount'
        default:
          $ref: './imported/apiErrors/apiErrors.yaml#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler:
    post:
      summary: Hent liste af dødsbojournaler.
      description: Dette kald giver mulighed for at fremsøge en dødbojournaler baseret på enten CPR-nr. eller navn og adresse.
      tags:
        - doedsbojournal
      operationId: searchBoV2
      parameters:
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/page'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/size'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/sort'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/direction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalQuery'
      responses:
        '200':
          description: Liste af dødsbojournaler som lever op til kriterierne.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournalV2'
          headers:
            'X-Total-Count':
              $ref: './imported/pagination/pagination.yaml#/components/headers/totalCount'
        default:
          $ref: './imported/apiErrors/apiErrors.yaml#/components/responses/genericErrorResponse'
  /doedsbojournaler/aendringer:
    post:
      summary: Hent liste af ændrede dødsbojournaler.
      description: Dette kald giver mulighed for at fremsøge dødsbojournaler som er ændret siden |
        et angivet tidspunkt. I praksis foregår det ved at der sendes en liste af doedsbojournalId'er samt et |
        et tidspunkt. Svaret er en liste af dødsbojournaler som er ændret siden det angivne tidspunkt.
      tags:
        - doedsbojournal
      operationId: findChangedSince
      parameters:
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/page'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/size'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalAendringer'
      responses:
        '200':
          description: Liste af dødsbojournaler som er ændret fra den angivne dato og frem.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournal'
          headers:
            'X-Total-Count':
              $ref: './imported/pagination/pagination.yaml#/components/headers/totalCount'
        default:
          $ref: './imported/apiErrors/apiErrors.yaml#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/aendringer:
    post:
      summary: Hent liste af ændrede dødsbojournaler.
      description: Dette kald giver mulighed for at fremsøge dødsbojournaler som er ændret siden |
        et angivet tidspunkt. I praksis foregår det ved at der sendes en liste af doedsbojournalId'er samt et |
        et tidspunkt. Svaret er en liste af dødsbojournaler som er ændret siden det angivne tidspunkt.
      tags:
        - doedsbojournal
      operationId: findChangedSinceV2
      parameters:
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/page'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/size'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalAendringer'
      responses:
        '200':
