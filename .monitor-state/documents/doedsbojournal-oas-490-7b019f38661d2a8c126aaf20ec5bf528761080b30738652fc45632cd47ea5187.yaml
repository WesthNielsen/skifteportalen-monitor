      summary: Hent liste af krav for en dødsbojournal.
      responses:
        '200':
          description: Liste af anmeldte krav for dødsbojournalen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/krav'
        default:
          $ref: './imported/apiErrors/apiErrors.yaml#/components/responses/genericErrorResponse'
    post:
      tags:
        - doedsbojournal
      operationId: addKrav
      summary: Anmeld krav til en dødsbojournal.
      deprecated: true
      description:
        Dette er ikke den nyeste version af dette endepunkt.
        Dette endepunkt vil være supporteret til og med 11-12-2024,
