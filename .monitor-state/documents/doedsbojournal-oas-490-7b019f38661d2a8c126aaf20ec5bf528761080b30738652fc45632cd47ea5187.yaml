      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/doedsbojournalAendringerKontaktperson'
      responses:
        '200':
          description: Liste af dødsbojournaler som er ændret fra den angivne dato og frem.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/doedsbojournal'
          headers:
            'X-Total-Count':
              $ref: './imported/pagination/pagination.yaml#/components/headers/totalCount'
        default:
          $ref: './imported/apiErrors/apiErrors.yaml#/components/responses/genericErrorResponse'
  /v2/doedsbojournaler/aendringerKontaktperson:
    post:
      summary: Hent liste af ændrede dødsbojournaler som kontaktperson.
      description: Dette kald giver mulighed for at fremsøge dødsbojournaler, som brugeren selv er kontaktperson for |
        eller bobehandler på. Svaret er en liste af dødsbojournaler som er ændret |
