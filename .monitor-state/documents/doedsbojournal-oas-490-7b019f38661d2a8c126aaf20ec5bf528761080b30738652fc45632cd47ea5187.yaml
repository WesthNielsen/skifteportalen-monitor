  /doedsbojournaler/registreringer:
    post:
      summary: Hent liste af registering id'er tilhørende indberetter.
      operationId: getRegistreringIdList
      tags:
        - doedsbojournal
      parameters:
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/page'
        - $ref: './imported/pagination/pagination.yaml#/components/parameters/size'
      requestBody:
        required: true
        description: Hent alle registrerings-ID'er uden at specificere nogen start- eller slutdato. |
          Specificér startdatoen for at hente registrerings-ID'er, der er oprettet/redigeret, fra startdatoen og indtil nu. |
          Specificér slutdatoen for at hente registrerings-ID'er, der er oprettet/redigeret, fra nu og indtil slutdatoen. |
          Specificér startdatoen og slutdatoen for at hente registrerings-ID'er, der er oprettet/redigeret, fra startdatoen og indtil slutdatoen.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/registreringQuery'
      responses:
        '200':
          description: Liste af registering id'er tilhørende indberetter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/registrering'
        default:
          $ref: './imported/apiErrors/apiErrors.yaml#/components/responses/genericErrorResponse'

  /doedsbojournaler/{doedsbojournalId}/opdateringAfKontaktpersonensDetaljerForVirksomhed:
    parameters:
      - $ref: '#/components/parameters/doedsbojournalId'
    post:
      tags:
        - doedsbojournal
      operationId: updateKontaktpersonDetaljerVirksomhed
      summary: Opdater detaljer om virksomheden, som er kontaktperson for dødsboet.
      description: Dette kald giver en virksomhed, som er kontaktperson på dødsboet, mulighed for at ændre detaljer for virksomheden. |
        Herunder telefonnummer, email adresse, anden adresse, c/o adresse og virksomhedens reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kontaktpersonVirksomhedOpdatering'
      responses:
        '201':
          description: Svar på opdateringen af kontaktpersonens detaljer.
          content:
            application/json:
              schema:
                $ref: './imported/doedsbojournal/doedsbojournal-common.yaml#/components/schemas/kontaktperson'
