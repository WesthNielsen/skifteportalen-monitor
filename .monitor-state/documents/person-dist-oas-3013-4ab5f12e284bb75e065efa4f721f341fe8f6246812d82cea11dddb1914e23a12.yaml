openapi: 3.0.3
info:
  title: Api til at hente personer
  description: Api til at hente personer.
  version: 3.0.13
servers:
- url: http://localhost:8080
paths:
  /personer/{personId}:
    get:
      parameters:
      - $ref: '#/components/parameters/personId'
      tags:
      - person
      operationId: getPersonById
      summary: Finder person med det angivne personId.
      deprecated: true
      responses:
        '200':
          description: Personen med det angivne personId returneres (uden CPR-nummer).
            Hvis personen er afdød og underlagt navne- og adressebeskyttelse på dødstidspunktet
            maskeres disse værdier for alle andre end sagsbehandler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/person'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/personer/{personId}:
    get:
      parameters:
      - $ref: '#/components/parameters/personId'
      tags:
      - person
      operationId: getPersonByIdV2
      summary: Finder person med det angivne personId. Benyttes til insolvens området.
      responses:
        '200':
          description: Personen med det angivne personId returneres (uden CPR-nummer).
            Hvis personen er afdød og underlagt navne- og adressebeskyttelse på dødstidspunktet
            maskeres disse værdier for alle andre end sagsbehandler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/person'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v3/personer/{personId}:
    get:
      parameters:
      - $ref: '#/components/parameters/personId'
      tags:
      - person
      operationId: getPersonByIdV3
      summary: Finder person med det angivne personId.
      responses:
        '200':
          description: Personen med det angivne personId returneres (uden CPR-nummer).
            Hvis personen er afdød og underlagt navne- og adressebeskyttelse på dødstidspunktet
            maskeres disse værdier for alle andre end sagsbehandler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cprPerson'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /identitet:
    get:
      tags:
      - person
      operationId: getIdentityFromToken
      summary: Finder person fra token.
      deprecated: true
      responses:
        '200':
          description: Personen fra token returneres (uden CPR-nummer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/person'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/identitet:
    get:
      tags:
      - person
      operationId: getIdentityFromTokenV2
      summary: Finder person fra token.
      responses:
        '200':
          description: Personen fra token returneres (uden CPR-nummer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/person'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v3/identitet:
    get:
      tags:
      - person
      operationId: getIdentityFromTokenV3
      summary: Finder person fra token.
      responses:
        '200':
          description: Personen fra token returneres (uden CPR-nummer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cprPerson'
        default:
          $ref: '#/components/responses/genericErrorResponse'
security:
- bearerAuth: [
    ]
components:
  parameters:
    personId:
      name: personId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
      description: Id på en person.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    person:
      properties:
        adresse:
          $ref: '#/components/schemas/darAdresse'
        personId:
          $ref: '#/components/schemas/id'
        fornavne:
          type: string
        efternavn:
          type: string
        foedselsdato:
          type: string
          format: date
        erNavnAdresseBeskyttet:
          type: boolean
      required:
      - foedselsdato
    cprPerson:
      properties:
        adresse:
          $ref: '#/components/schemas/adresse'
        personId:
          $ref: '#/components/schemas/id'
        fornavne:
          type: string
        efternavn:
          type: string
        foedselsdato:
          type: string
          format: date
        erNavnAdresseBeskyttet:
          type: boolean
      required:
      - foedselsdato
    apiError:
      x-namespace: dk.domstol.oas.common
      required:
      - code
      - status
      - message
      - path
      - timestamp
      properties:
        code:
          description: Human readable HTTP status message.
          type: string
        status:
          description: HTTP status code.
          type: integer
        message:
          description: Message describing the error.
          type: string
        path:
          description: The path of the error.
          type: string
        timestamp:
          description: Date and time of the error.
          type: string
          format: date-time
        details:
          description: Detailed description of the error(s).
          type: array
          items:
            $ref: '#/components/schemas/details'
    details:
      type: string
    id:
      type: string
      format: uuid
    retskredsId:
      description: Unikt ID for en given retskreds, der kan anvendes til identificering
        af en specifik retskreds i retskreds-service.
      type: string
      pattern: ^\d{4}$
    darAdresse:
      deprecated: true
      x-namespace: dk.domstol.oas.common
      description: Repræsentation af adresse fra Dansk Adresse Register (DAR).
      required:
      - id
      - adresselinje
      - postnummer
      - by
      properties:
        id:
          $ref: '#/components/schemas/id'
        adresselinje:
          type: string
        postnummer:
          type: string
        by:
          type: string
        retskredsId:
