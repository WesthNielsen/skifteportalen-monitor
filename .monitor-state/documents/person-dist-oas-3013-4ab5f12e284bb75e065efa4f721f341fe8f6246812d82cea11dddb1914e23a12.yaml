    struktureretDanskAdresse:
      description: Dansk struktureret adresse.
      x-namespace: dk.domstol.oas.common.adressev2
      required:
      - adresselinje
      - postnummer
      - postdistrikt
      properties:
        darId:
          $ref: '#/components/schemas/id'
        adresselinje:
          type: string
        postnummer:
          type: string
        postdistrikt:
          description: Navnet på postnummeret. Dette fremstilles typisk som sidste
            led, fx 2630 Taastrup.
          type: string
        supplerendeBynavn:
          description: 'Optionelt felt - typisk landsbyens navn eller andet lokalt
            stednavn der er fastsat af kommunen for at præcisere adressens beliggenhed
            indenfor postnummeret. Indgår som en del af den officielle adressebetegnelse.
            Indtil 34 tegn. Eksempel: ”Sønderholm”.'
          type: string
          maxLength: 34
    fritekstadresse:
      description: Danske eller udenlandsk adresse i fritekstform.
      x-namespace: dk.domstol.oas.common.adressev2
      required:
      - adresselinje1
      properties:
        adresselinje1:
          type: string
          maxLength: 200
        adresselinje2:
          type: string
          maxLength: 200
        adresselinje3:
          type: string
          maxLength: 200
        adresselinje4:
          type: string
          maxLength: 200
        adresselinje5:
          type: string
          maxLength: 200
        landekode:
          $ref: '#/components/schemas/landekodeEnum'
    adresse:
      description: Wrapper til adresser af forskellige typer.
      x-namespace: dk.domstol.oas.common.adressev2
      required:
