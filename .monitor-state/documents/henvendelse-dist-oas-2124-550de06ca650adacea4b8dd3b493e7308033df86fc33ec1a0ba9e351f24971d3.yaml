    fritekstadresse:
      description: Danske eller udenlandsk adresse i fritekstform.
      x-namespace: dk.domstol.oas.common.adressev2
      required:
      - adresselinje1
      properties:
        adresselinje1:
          type: string
          maxLength: 200
        adresselinje2:
          type: string
          maxLength: 200
        adresselinje3:
          type: string
          maxLength: 200
        adresselinje4:
          type: string
          maxLength: 200
        adresselinje5:
          type: string
          maxLength: 200
        landekode:
          $ref: '#/components/schemas/landekodeEnum'
    personReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til person som har og kan identificeres med et CPR-nr.
      required:
      - personId
      properties:
        personId:
          $ref: '#/components/schemas/id'
    virksomhedReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til virksomhed.
      required:
      - cvrNummer
      properties:
        cvrNummer:
          $ref: '#/components/schemas/cvrNummer'
    professionelReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til professionel medarbejder.
      required:
      - cvrNummer
      - persistentId
      properties:
        cvrNummer:
          $ref: '#/components/schemas/cvrNummer'
        persistentId:
          type: string
    apiReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til partner profil api deltager delegation token. Specialisering
        af partnerReference.
      required:
      - partnerNavn
      - partnerId
      - apiDeltagerId
      properties:
        partnerNavn:
          type: string
          maxLength: 200
        partnerId:
          $ref: '#/components/schemas/id'
        apiDeltagerId:
          type: string
          description: Partner profil deltager id (api_deltager) i delegation token.
    fritekstPart:
      x-namespace: dk.domstol.oas.common
      description: Fritekst part (person) givet ved et navn og en adresse. Benyttes
        når personen ikke har et CPR-nr.
      required:
      - navn
      - adresse
      properties:
        navn:
          type: string
          maxLength: 200
        adresse:
          $ref: '#/components/schemas/fritekstadresse'
    internReference:
      x-namespace: dk.domstol.oas.common
      required:
      - adId
      properties:
        adId:
          type: string
    partnerReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til partner med et partnerId i partner registeret.
      required:
      - partnerId
      properties:
        partnerId:
          $ref: '#/components/schemas/id'
    anvenderPartTypeEnum:
      x-namespace: dk.domstol.oas.common
      description: Typen af en anvenderPart. Person givet ved personId, virksomhed
        givet ved CVR-nummer, udenlandsk virksomhed eller person, partner ved partnerId
        eller system.
      type: string
      enum:
      - PERSON
      - VIRKSOMHED
      - UDENLANDSK
      - INTERN
      - PARTNER
      - PROFESSIONAL
      - API
      - SYSTEM
    systemPart:
      required:
      - name
      properties:
        name:
          type: string
    anvenderPart:
      x-namespace: dk.domstol.oas.common
      description: Repræsentation af en part som kan anvende systemet.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/anvenderPartTypeEnum'
        person:
          $ref: '#/components/schemas/personReference'
        virksomhed:
          $ref: '#/components/schemas/virksomhedReference'
        fritekst:
          $ref: '#/components/schemas/fritekstPart'
        intern:
          $ref: '#/components/schemas/internReference'
        partner:
          $ref: '#/components/schemas/partnerReference'
        professionel:
          $ref: '#/components/schemas/professionelReference'
        api:
          $ref: '#/components/schemas/apiReference'
        system:
          $ref: '#/components/schemas/systemPart'
    henvendelse:
      x-namespace: dk.domstol.oas.common
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sagId:
          type: string
          format: uuid
          readOnly: true
        traadId:
          type: string
          format: uuid
        emneord:
          type: string
          format: string
          readOnly: true
        tekst:
          type: string
          format: string
          maxLength: 3000
        dokumenter:
          type: array
          items:
            $ref: '#/components/schemas/henvendelseDokument'
        oprettet:
          type: string
          format: date-time
          readOnly: true
        oprettetAfNavnTitel:
          type: string
          format: string
          readOnly: true
        oprettetAf:
          readOnly: true
          $ref: '#/components/schemas/anvenderPart'
        laeseStatus:
