openapi: 3.0.3
info:
  title: API for Henvendelser
  description: Fælles API for behandling af henvendelser(beskeder) og tråde mellem
    deltagere og retterne. DEPRECATED for insolvenssager - på insolvensområdet er
    henvendelser udgående (deprecated) og udfases efter en overgangsperiode (datoen
    for endelig udfasning er endnu ikke fastlagt og meldes ud i god tid). På insolvensområdet
    erstattes dette API af GET /v2/insolvenssagerEkstern/{sagId}/meddelelser, GET
    /v2/insolvenssagerEkstern/{sagId}/dokumenter og Skriv til retten i insolvens-dirigent-ekstern-oas
    (v2).
  version: 2.1.24
servers:
- url: http://localhost:8080
paths:
  /henvendelseTraade:
    get:
      tags:
      - henvendelse
      operationId: hentHenvendelseTraadeForSag
      deprecated: true
      description: Hent alle tråde for et sagsId. Henvendelser returneres IKKE. På
        insolvensområdet er dette endepunkt udgående (deprecated) og erstattes af
        insolvens-dirigent-ekstern-oas (v2); datoen for endelig udfasning er endnu
        ikke fastlagt.
      parameters:
      - in: query
        name: sagsId
        schema:
          type: string
          format: uuid
        required: true
        description: Id for sagen som der skal hentes henvendelsestråde for.
      responses:
        '200':
          description: Trådene blev hentet med success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/henvendelseTraad'
        '404':
          description: Det angivne sagsId findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /henvendelseTraade/{traadId}:
    parameters:
    - $ref: '#/components/parameters/traadId'
    get:
      tags:
      - henvendelse
      operationId: hentHenvendelseTraad
      deprecated: true
      description: Hent tråden med angivne id. På insolvensområdet er dette endepunkt
        udgående (deprecated) og erstattes af insolvens-dirigent-ekstern-oas (v2);
        datoen for endelig udfasning er endnu ikke fastlagt.
      responses:
        '200':
          description: Tråden blev hentet med success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/henvendelseTraad'
        '404':
          description: Henvendelsestråden findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    put:
      tags:
      - henvendelse
      operationId: opdaterHenvendelseTraad
      deprecated: true
      description: Opdater properties på eksisterende tråd. Det er udelukkende 'erAfsluttet'
        som kan opdateres. Andre properties ignoreres. På insolvensområdet er dette
        endepunkt udgående (deprecated) og erstattes af insolvens-dirigent-ekstern-oas
        (v2); datoen for endelig udfasning er endnu ikke fastlagt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putHenvendelseTraad'
      responses:
        '200':
          description: Tråden blev opdateret med success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/henvendelseTraad'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /henvendelseTraade/{traadId}/henvendelser/{henvendelseId}:
    parameters:
    - $ref: '#/components/parameters/traadId'
    - $ref: '#/components/parameters/henvendelseId'
    get:
      summary: Henter en henvendelse med angivne id.
      tags:
      - henvendelse
      operationId: hentHenvendelse
      deprecated: true
      description: Hent henvendelsen med angivne id. På insolvensområdet er dette
        endepunkt udgående (deprecated) og erstattes af insolvens-dirigent-ekstern-oas
        (v2); datoen for endelig udfasning er endnu ikke fastlagt.
      responses:
        '200':
          description: Henvendelsen blev hentet med success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/henvendelse'
        '404':
          description: Henvendelsen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    put:
      tags:
      - henvendelse
      operationId: opdaterHenvendelse
      deprecated: true
      description: Opdater properties på eksisterende henvendelse. Det er udelukkende
        'laeseStatus' som kan opdateres. Andre properties ignoreres. På insolvensområdet
        er dette endepunkt udgående (deprecated) og erstattes af insolvens-dirigent-ekstern-oas
        (v2); datoen for endelig udfasning er endnu ikke fastlagt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putHenvendelse'
      responses:
        '200':
          description: Henvendelsen blev opdateret med success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/henvendelse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
components:
  schemas:
    putHenvendelse:
      required:
      - laeseStatus
      properties:
        laeseStatus:
          $ref: '#/components/schemas/laeseStatus'
    putHenvendelseTraad:
      required:
      - erAfsluttet
      properties:
        erAfsluttet:
          type: boolean
    directionEnum:
      x-namespace: dk.domstol.oas.common
      type: string
      enum:
      - ASC
      - DESC
    id:
      type: string
      format: uuid
    cvrNummer:
      type: string
      pattern: ^[1-9][0-9]{7}$
    apiError:
      x-namespace: dk.domstol.oas.common
      required:
      - code
      - status
      - message
      - path
      - timestamp
      properties:
        code:
          description: Human readable HTTP status message.
          type: integer
        status:
          description: HTTP status code.
          type: integer
        message:
          description: Message describing the error.
          type: string
        path:
          description: The path of the error.
          type: string
        timestamp:
          description: Date and time of the error.
          type: string
          format: date-time
        details:
          description: Detailed description of the error(s).
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/details'
        errorDetails:
          description: Detailed description of the error(s).
          type: array
          items:
            $ref: '#/components/schemas/details'
    details:
      required:
      - message
      properties:
        message:
          type: string
        code:
          type: string
