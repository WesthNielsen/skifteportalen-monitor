        laeseStatusAendret:
          type: string
          format: date-time
          readOnly: true
        laeseStatusAendretAfNavnTitel:
          type: string
          format: string
          readOnly: true
        laeseStatusAendretAf:
          readOnly: true
          $ref: '#/components/schemas/anvenderPart'
    henvendelseTraad:
      x-namespace: dk.domstol.oas.common
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sagId:
          type: string
          format: uuid
        emneord:
          type: string
          format: string
        henvendelser:
          type: array
          items:
            $ref: '#/components/schemas/henvendelse'
        antalHenvendelser:
          type: integer
          minimum: 1
          readOnly: true
        harDokumenter:
          type: boolean
          readOnly: true
        oprettet:
          type: string
          format: date-time
          readOnly: true
        oprettetAfNavnTitel:
          type: string
          format: string
          readOnly: true
        oprettetAf:
          readOnly: true
          $ref: '#/components/schemas/anvenderPart'
        harUlaesteHenvendelser:
          type: boolean
          readOnly: true
        afsluttet:
          type: string
          format: date-time
          readOnly: true
        afsluttetAf:
          readOnly: true
          $ref: '#/components/schemas/anvenderPart'
        erAfsluttet:
          type: boolean
          readOnly: true
    henvendelseDokument:
      x-namespace: dk.domstol.oas.common
      required:
      - dokumentId
      - filnavn
      properties:
        dokumentId:
          type: string
          format: uuid
        navn:
          type: string
          format: string
        filnavn:
          type: string
          format: string
        type:
          type: string
          enum:
          - OEVRIGE
          - TESTAMENTE
    laeseStatus:
      x-namespace: dk.domstol.oas.common
      type: string
      enum:
      - ULAEST
      - LAEST
  parameters:
    traadId:
      name: traadId
      in: path
      schema:
        type: string
        format: uuid
      required: true
      description: Id på henvendelsestråden som skal hentes eller opdateres.
    henvendelseId:
      name: henvendelseId
      in: path
      schema:
        type: string
        format: uuid
      required: true
      description: Id på henvendelsen som skal hentes eller opdateres.
  headers: {
    }
  responses:
    genericErrorResponse:
      description: Svar ved fejl.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
  requestBodies: {
    }
