          type: string
          description: Hvis selskabet har aktiver beskrives hvilket.
          maxLength: 1024
        gaeld:
          type: boolean
          description: Har selskabet gæld.
        gaeldBeloeb:
          type: number
          description: Angiv beløb for gælds størrelse i DKK.
        bank:
          type: array
          description: Angiv selskabets bank konti.
          items:
            $ref: '#/components/schemas/bank'
        selskabetsRegnskabsbilag:
          type: string
          description: Angiver hos hvem selskabets regnskabsbilag kan forefindes.
          maxLength: 1024
        bemaerkninger:
          type: string
          description: Øvrige bemærkninger.
          maxLength: 2048
        oenskerSelskabGenoptaget:
          type: boolean
          description: Selskab ønskes genoptaget.
        oenskerSelskabOploest:
          type: boolean
          description: Selskab ønskes opløst.
    bank:
      x-namespace: dk.domstol.oas.common.insolvens
