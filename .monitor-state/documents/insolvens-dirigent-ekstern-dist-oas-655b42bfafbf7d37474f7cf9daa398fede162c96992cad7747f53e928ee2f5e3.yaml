            være null.
          type: array
          items:
            $ref: '#/components/schemas/fristEkstern'
        dokumenter:
          description: Sagsdokumenter på den specifikke sag.
          type: array
          items:
            $ref: '#/components/schemas/dokumentSamlingEkstern'
