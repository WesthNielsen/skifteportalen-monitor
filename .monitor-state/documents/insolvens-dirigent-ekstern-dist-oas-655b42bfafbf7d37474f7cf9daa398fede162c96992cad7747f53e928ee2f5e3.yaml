openapi: 3.0.3
info:
  title: API til dirigent forespørgsler for tvangsopløsningssager.
  description: Denne specifikation er tiltænkt eksterne brugere af vores egen web-brugergrænseflade,
    uanset hvilken relation brugeren har til en given sag.
  version: 8.12.12
servers:
- url: http://localhost:8080
paths:
  /insolvenssagerEkstern:
    post:
      tags:
      - insolvensDirigentEkstern
      operationId: opretInsolvenssagEkstern
      description: Opret en ny insolvenssag som ekstern bruger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/opretInsolvenssagEkstern'
      responses:
        201:
          description: Insolvenssag er oprettet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oprettetInsolvenssagEkstern'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentTvangsoploesningssag
      description: Hent specifik tvangsopløsningssag udfra dets sag id (ikke sagsnummer).
      responses:
        200:
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tvangsoploesningssagEkstern'
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/sagens-gang:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/page'
    - $ref: '#/components/parameters/size'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: getSagensGangListe
      description: Hent liste (side) af sagens gang hændelser som ekstern (pånær likvidator).
      responses:
        200:
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/sagensGangBegivenhed'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerTidlLedelse/{sagId}/erklaering:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - insolvensDirigentEkstern
      operationId: postErklaering
      description: Indsend erklæring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/erklaering'
      responses:
        201:
          description: Erklæring er gemt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/erklaering'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerTidlLedelse/{sagId}/kontaktoplysninger:
    parameters:
    - $ref: '#/components/parameters/sagId'
    put:
      tags:
      - insolvensDirigentEkstern
      operationId: updateKontaktoplysninger
      description: Opdater kontaktoplysningerne for direktøren selv.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kontaktoplysningerOpdatering'
      responses:
        200:
          description: Kontaktoplysninger er opdateret.
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/kaeremaal:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - insolvensDirigentEkstern
      operationId: opretKaeremaal
      description: Opret kæremål som ekstern til sagen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/opretKaeremaal'
      responses:
        201:
          description: Kæremål oprettet succesfuldt.
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/afgoerelser:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentAfgoerelser
      description: Hent en liste af afgørelser (retsbøger) på sagen.
      responses:
        200:
          description: Liste af afgørelser på sagen hentet succesfuldt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/afgoerelse'
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/krav:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      operationId: hentKrav
      description: Hent en side af krav der matcher ønsket sortering, sammen med en
        samlet summering for alle krav.
      responses:
        200:
          description: Side af krav hentet med succes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kravListe'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/tilgodehavender:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      operationId: hentTilgodehavender
      description: Hent en side af tilgodehavender der matcher ønsket sortering, sammen
        med en samlet summering for alle tilgodehavender.
      responses:
        200:
          description: Side af tilgodehavender hentet med succes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tilgodehavendeListe'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/retsboeger:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      operationId: hentRetsboeger
      description: Hent en side af retsbøger der matcher ønsket sortering.
      responses:
        200:
          description: Side af retsbøger hentet med succes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/retsbogEkstern'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/meddelelser:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentMeddelelser
      description: Hent alle meddelelser til brugeren på sagen.
      responses:
        200:
          description: Meddelelser hentet med succes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/detaljeretMeddelelse'
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/frister/{fristId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/fristId'
    post:
      tags:
      - insolvensDirigentEkstern
      operationId: haandterFrist
      description: Håndter manuelt oprettet frist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/besvarelseRequest'
      responses:
        201:
          description: Besvarelse er gemt.
        404:
          description: Sagen findes ikke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
security:
- bearerAuth: [
    ]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    sagId:
      name: sagId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
    fristId:
      name: fristId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
    page:
      name: page
      description: Side for paginering.
      required: false
      in: query
      schema:
        type: integer
    size:
      name: size
      description: Antal elementer pr. side.
      required: false
      in: query
      schema:
        type: integer
    sort:
      name: sort
      description: Liste af felter der skal sorteres på.
      required: false
      in: query
      schema:
        type: array
        items:
          type: string
    direction:
      name: direction
      description: Stigende eller faldende retning for søgeresultater.
      in: query
      schema:
        $ref: '#/components/schemas/directionEnum'
  schemas:
    opretInsolvenssagEkstern:
      required:
      - sagstype
      - retskreds
      properties:
        sagstype:
          $ref: '#/components/schemas/opretInsolvenssagTypeEkstern'
        retskreds:
          $ref: '#/components/schemas/embedskode'
        dokumenter:
          description: Liste af dokumenter der skal vedhæftes sagen ved oprettelse.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/insolvensDokument'
        bemaerkning:
          description: Eventuel bemærkning til sagen ved oprettelse.
          type: string
          minLength: 1
          maxLength: 2000
    oprettetInsolvenssagEkstern:
      required:
      - sagId
      - sagsnummer
      properties:
        sagId:
          type: string
          format: uuid
        sagsnummer:
          type: string
    opretInsolvenssagTypeEkstern:
      type: string
      enum:
      - KONKURSBEGAERING
      - GAELDSSANERING
      - REKONSTRUKTION
      - FOREBYGGENDE_REKONSTRUKTION
      - AEGTEFAELLESKIFTE
      - ANDRE_SAGER_EFTER_SELSKABSLOVEN
    sagensGangBegivenhed:
      required:
      - oprettet
      - foretagetAf
      - beskrivelse
      properties:
        oprettet:
          description: Tidspunkt hvor hændelsen fandt sted.
          type: string
          format: date-time
        foretagetAf:
          $ref: '#/components/schemas/haendelsePartEkstern'
        beskrivelse:
          description: En kort beskrivelse af hvilken hændelse der er tale om - ala
            en titel.
          example: Anmodning om vidneafhøring
          type: string
    kontaktoplysningerOpdatering:
      description: Oprettelse eller opdatering af kontaktoplysninger for direktøren
        selv.
      properties:
        kontaktoplysninger:
          $ref: '#/components/schemas/kontaktoplysninger'
    opretKaeremaal:
      description: Data til oprettelse af et nyt kæremål.
      required:
      - afgoerelseId
      properties:
        afgoerelseId:
          description: Id på den afgørelse (retsbog) som der ønskes kæret.
          type: string
          format: uuid
        paastand:
          description: Fritekstangivelse af hvad og hvorfor man ønsker at kære.
          type: string
          maxLength: 1200
        begrundelse:
          description: Fritekstangivelse for hvorfor skifterettens afgørelse skal
            ændres.
          type: string
          maxLength: 1200
        bilag:
          description: Bilag der underbygger den kærendes påstand. Hvis ingen bilag
            sendes tom liste, ikke null.
          type: array
          items:
            $ref: '#/components/schemas/dokumentReference'
    afgoerelse:
      description: Data om hver afgørelse der er truffet i sagen.
      required:
      - afgoerelseId
      - afgoerelseTitel
      properties:
        afgoerelseId:
          description: Id på den afgørelse (retsbog) som der ønskes kæret.
          type: string
          format: uuid
        afgoerelseTitel:
          description: Titlen på afgørelsen, der er sigende for den afgørelse der
            er truffet.
          type: string
          maxLength: 200
    kravListe:
      description: En pagineret liste af krav sammen med en total sum af alle krav
        som brugeren må se (på tværs af paginerede sider).
      required:
      - krav
      - totalSum
      properties:
        krav:
          description: En (pagineret) side af krav for brugeren.
          type: array
          items:
            $ref: '#/components/schemas/kravListItem'
        totalSum:
          description: Samlet sum af alle krav for brugeren på tværs af paginerede
            sider.
          type: number
    tilgodehavendeListe:
      description: En pagineret liste af tilgodehavender sammen med en total sum af
        alle tilgodehavender som brugeren må se (på tværs af paginerede sider).
      required:
      - tilgodehavender
      - totalSum
      properties:
        tilgodehavender:
          description: En (pagineret) side af tilgodehavender for brugeren.
          type: array
          items:
            $ref: '#/components/schemas/tilgodehavendeListItem'
        totalSum:
          description: Samlet sum af alle tilgodehavender for brugeren på tværs af
            paginerede sider.
          type: number
    besvarelseRequest:
      description: Besvarelse med fritekst og bilag. Hvis ingen bilag vedlægges bliver
        fritekst krævet.
      properties:
        fritekst:
          type: string
          minLength: 3
          maxLength: 1200
        bilag:
          description: Liste (potentielt tom) af bilag som ekstern bruger ønsker at
            uploade til at understøtte sin besvarelse. Hvert bilag uploades først
            til dokumentlageret, og det returnerede tekniske ID/reference for dokumentet
            anvendes her.
          type: array
          items:
            $ref: '#/components/schemas/dokumentReference'
    tvangsoploesningAarsag:
      x-namespace: dk.domstol.oas.common.insolvens
      type: string
      enum:
      - MANGLENDE_REGNSKAB
      - OEVRIGE
    aarsag:
      x-namespace: dk.domstol.oas.common.insolvens
      type: object
      required:
      - type
      - tekst
      properties:
        type:
          $ref: '#/components/schemas/tvangsoploesningAarsag'
        tekst:
          type: string
    ledelsesmedlem:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Data for et tidligere ledelsesmedlem i en insolvens-sag.
      required:
      - part
      - hemmeligAdresse
      properties:
        part:
          $ref: '#/components/schemas/part'
        relationInformation:
          $ref: '#/components/schemas/ledelsesmedlemInformation'
        kontaktoplysninger:
          $ref: '#/components/schemas/kontaktoplysninger'
        hemmeligAdresse:
          type: boolean
          description: Angiver om adressen er hemmelig, skal angives når seneste ledelse
            er udenlandsk. Ellers altid false.
    tvangsoploesningDokumentType:
      x-namespace: dk.domstol.oas.common.insolvens
      type: string
      enum:
      - ANMODNING_OM_OPLOESNING
      - ANMODNING_OM_FRISTUDSAETTELSE
      - OPLOESNINGSTRUSSEL
      - ERKLAERING
      - RETSBOG
      - INHABILITETSERKLAERING
      - OEVRIGE
      - VURDERINGDATA
      example: ANMODNING_OM_OPLOESNING
    insolvensDokumentType:
      x-namespace: dk.domstol.oas.common.insolvens
      type: string
      enum:
      - ANMODNING_OM_OPLOESNING
      - ANMODNING_OM_FRISTUDSAETTELSE
      - OPLOESNINGSTRUSSEL
      - ERKLAERING
      - RETSBOG
      - INHABILITETSERKLAERING
      - OEVRIGE
      - VURDERINGDATA
      - ANMODNING_OM_KONKURSBEGAERING
      - ANMODNING_OM_GAELDSSANERING
      - ANMODNING_OM_REKONSTRUKTION
      - ANMODNING_OM_FOREBYGGENDE_REKONSTRUKTION
      - ANMODNING_OM_AEGTEFAELLESKIFTE
      - ANMODNING_OM_ANDRE_SAGER_EFTER_SELSKABSLOVEN
      example: ANMODNING_OM_OPLOESNING
    dokumentReference:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Reference til dokument i dokumentlageret.
      required:
      - id
      properties:
        id:
          description: Teknisk ID for dokumentet, nogle steder refereret til som dokument
            referencen.
          type: string
          format: uuid
    tvangsoploesningDokument:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Dokument relateret til insolvens.
      required:
      - reference
      - type
      properties:
        reference:
          $ref: '#/components/schemas/dokumentReference'
        type:
          $ref: '#/components/schemas/tvangsoploesningDokumentType'
    insolvensDokument:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Dokument relateret til insolvens.
      required:
      - reference
      - type
      properties:
        reference:
          $ref: '#/components/schemas/dokumentReference'
        type:
          $ref: '#/components/schemas/insolvensDokumentType'
        eksterneAdgange:
          description: Liste af eksterne parter med direkte adgang til dokumentet.
          type: array
          items:
            $ref: '#/components/schemas/sagsaktoerAdgang'
    sagsaktoerAdgang:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Beskriver en ekstern part med adgang til et dokument eller en dokumentsamling.
      required:
      - partId
      - partReference
      - navn
      - relationTilSag
      properties:
        partId:
          $ref: '#/components/schemas/partReference'
        partReference:
          $ref: '#/components/schemas/anvenderPart'
        navn:
          description: Navnet på parten.
          type: string
        danskAdresse:
          $ref: '#/components/schemas/danskAdresse'
        udenlandskAdresse:
          $ref: '#/components/schemas/fritekstadresse'
        relationTilSag:
          $ref: '#/components/schemas/eksternAktoerGruppe'
    eksternAktoerGruppe:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Angiver en ekstern aktørgruppe i relation til insolvenssagen.
      type: string
      enum:
      - TIDL_LEDELSESMEDLEMMER
      - LIKVIDATORER
      - KREDITORER
      - OEVRIGE
    partReference:
      x-namespace: dk.domstol.oas.common.insolvens
      description: ID på parten.
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    ledelsesmedlemInformation:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Information om det tidligere ledelsesmedlems relation til selskabet
        under tvangsopløsning/konkurs.
      properties:
        tiltraadt:
          type: string
          format: date
        fratraadt:
          type: string
          format: date
        kontaktadresser:
          type: array
          items:
            $ref: '#/components/schemas/fritekstadresse'
    detaljeretMeddelelse:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Meddelelse på sagen, dette værende et dokument der er sendt imellem
        parter på sagen.
      required:
      - meddelelseId
      - reference
      - meddelelseTitel
      - afsender
      - afsendelsesdato
      properties:
        meddelelseId:
          type: string
          format: uuid
        reference:
          $ref: '#/components/schemas/dokumentReference'
        meddelelseTitel:
          type: string
        afsender:
          description: Navn på afsender, fx person navn eller navn på et embede.
          type: string
        afsendelsesdato:
          type: string
          format: date
        modtagerNavn:
          type: string
        navneOgAdresseBeskyttet:
          description: For danske personer angives om personen er navne- og adressebeskyttet.
            Øvrige modtagere vil have angivet dette felt som false.
          type: boolean
    kontaktoplysninger:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Kontaktoplysninger (email adresse og/eller telefonnummer) for en
        person eller virksomhed.
      properties:
        telefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        email:
          $ref: '#/components/schemas/email'
    haendelsePartEkstern:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Repræsenterer alle de typer af parter der kan logge ind og lave
        ændringer i systemet. Hvis en intern har foretaget ændringer returneres medarbejderens
        embedskode, som kan veksles til et embede i retskreds-service.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/haendelsePartType'
        virksomhed:
          $ref: '#/components/schemas/virksomhedReference'
        person:
          $ref: '#/components/schemas/personReference'
        fritekst:
          $ref: '#/components/schemas/fritekstPart'
        partner:
          $ref: '#/components/schemas/partnerReference'
        intern:
          $ref: '#/components/schemas/embedskode'
        system:
          $ref: '#/components/schemas/systemPart'
    haendelsePartType:
      x-namespace: dk.domstol.oas.common.insolvens
      description: Type af historik-part. Inkluderer alle typer der kan logge ind
        og lave ændringer i systemet.
      type: string
      enum:
      - PERSON
      - VIRKSOMHED
      - FRITEKST
      - PARTNER
      - INTERN
      - SYSTEM
    tidsinterval:
      x-namespace: dk.domstol.oas.common.insolvens
      type: string
      pattern: ^(\d{1,4})-(\d{1,4})$
