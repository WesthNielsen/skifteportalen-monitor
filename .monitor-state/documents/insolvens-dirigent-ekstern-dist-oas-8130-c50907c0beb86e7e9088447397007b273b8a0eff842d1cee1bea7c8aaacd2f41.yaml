    insolvenssagEksternV2:
      description: Insolvenssag som den fremstår for en ekstern bruger, uanset hvilken
        af de 7 sagstyper der er tale om. Kun oplysninger der er trygge at eksponere
        til en tredjeparts-API-bruger er medtaget. Felter der kan være skjult for
        den enkelte bruger (embedskode, modtagelsestidspunkt) er ikke required; skjult
        betyder at feltet udelades eller er null.
      example:
        sagId: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
        sagsnummer: BS-1234/2026
        embedskode: KBH
        modtagelsestidspunkt: '2026-03-01T08:30:00+01:00'
        status: UNDER_BEHANDLING
        sagType: KONKURS
        roller:
        - KREDITOR
        detaljer:
          detaljerType: KONKURS
          dekretdato: '2026-03-05'
      required:
      - sagId
      - sagsnummer
      - status
      - sagType
      - roller
      - detaljer
      properties:
        sagId:
          $ref: '#/components/schemas/id'
        sagsnummer:
          description: Sagens brugervendte sagsnummer ved retten.
          type: string
        embedskode:
          $ref: '#/components/schemas/embedskode'
          description: Embedskode for det embede sagen hører til. Udelades hvis brugeren
            ikke må se oplysningen.
        modtagelsestidspunkt:
          description: Tidspunkt hvor sagen blev modtaget (date-time med tidszoneoffset,
            se Dato og tid i info.description). Er ikke required, da oplysningen skjules
            for brugere uden rolle på sagen. Skjult betyder at feltet udelades eller
            er null.
          type: string
          format: date-time
        afslutningsdato:
          description: Dato hvor sagen blev afsluttet (kun udfyldt når sagen er afsluttet).
          type: string
          format: date
        status:
          $ref: '#/components/schemas/statusEnumEksternV2'
        sagType:
          $ref: '#/components/schemas/insolvenssagTypeEksternV2'
        roller:
          description: Liste af roller/relationer den indloggede bruger selv har til
            sagen.
          type: array
          items:
            $ref: '#/components/schemas/sagsdeltagerRolleEnumEksternV2'
        detaljer:
          $ref: '#/components/schemas/insolvenssagDetaljerEksternV2'
    insolvenssagDetaljerEksternV2:
      description: Sagstype-specifikke detaljer. Præcis én variant returneres, og
        discriminatoren detaljerType (samme værdi som sagens sagType) afgør hvilken.
      type: object
      oneOf:
      - $ref: '#/components/schemas/tvangsoploesningInsolvenssagDetaljerEksternV2'
      - $ref: '#/components/schemas/konkursInsolvenssagDetaljerEksternV2'
      - $ref: '#/components/schemas/gaeldssaneringInsolvenssagDetaljerEksternV2'
      - $ref: '#/components/schemas/rekonstruktionInsolvenssagDetaljerEksternV2'
      - $ref: '#/components/schemas/forebyggendeRekonstruktionInsolvenssagDetaljerEksternV2'
      - $ref: '#/components/schemas/aegtefaelleskifteInsolvenssagDetaljerEksternV2'
      - $ref: '#/components/schemas/andreSagerEfterSelskabslovenInsolvenssagDetaljerEksternV2'
      discriminator:
        propertyName: detaljerType
        mapping:
          TVANGSOPLOESNING: '#/components/schemas/tvangsoploesningInsolvenssagDetaljerEksternV2'
          KONKURS: '#/components/schemas/konkursInsolvenssagDetaljerEksternV2'
          GAELDSSANERING: '#/components/schemas/gaeldssaneringInsolvenssagDetaljerEksternV2'
          REKONSTRUKTION: '#/components/schemas/rekonstruktionInsolvenssagDetaljerEksternV2'
          FOREBYGGENDE_REKONSTRUKTION: '#/components/schemas/forebyggendeRekonstruktionInsolvenssagDetaljerEksternV2'
          AEGTEFAELLESKIFTE: '#/components/schemas/aegtefaelleskifteInsolvenssagDetaljerEksternV2'
          ANDRE_SAGER_EFTER_SELSKABSLOVEN: '#/components/schemas/andreSagerEfterSelskabslovenInsolvenssagDetaljerEksternV2'
    tvangsoploesningInsolvenssagDetaljerEksternV2:
      type: object
      description: Detaljer specifikke for tvangsopløsningssager.
      required:
      - detaljerType
      properties:
        detaljerType:
          description: Altid TVANGSOPLOESNING for denne variant (discriminator).
          type: string
          pattern: ^TVANGSOPLOESNING$
        afgoerelsesdato:
          description: Dato hvor afgørelsen om at tvangsopløse selskabet blev truffet
