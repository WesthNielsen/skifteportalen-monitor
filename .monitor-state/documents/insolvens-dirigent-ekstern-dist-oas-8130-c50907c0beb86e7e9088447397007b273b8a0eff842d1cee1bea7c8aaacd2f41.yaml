security:
- bearerAuth: [
    ]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Alle operationer kræver et gyldigt JWT bearer-token i `Authorization`-headeren.

        **Token-typer.** Tokenet repræsenterer enten en person, en virksomhed, en adgangsprofildeltager eller en professionel bruger (MitID Erhverv, fx advokat, revisor, likvidator; bemærk at JWT-token-typen PROFESSIONEL angiver erhvervslogin og er adskilt fra sagsdeltagergruppen RETTENS_UDPEGEDE på sagen). Kun disse typer må kalde API'et.

        **Fejl.** Mangler tokenet eller er det ugyldigt eller udløbet, svarer API'et 401. Har tokenet en anden type end de ovenstående, svarer API'et 403. 403 gives også når brugeren har en relation til sagen, men ikke må udføre handlingen. Hvis brugeren ingen relation har til sagen, svarer API'et 404.

        **Hvem må hvad (V2).**

        | Operationer | Hvem |
        |---|---|
        | Opret insolvenssag | Bruger med en token-type ovenfor; sagstype TVANGSOPLOESNING kan ikke oprettes (oprettes af Erhvervsstyrelsen) |
        | Hent sag, sagens gang, retsbøger, meddelelser, dokumenter, emner til skriv til retten | Bruger med relation til sagen; indholdet afgrænses af brugerens rolle |
        | Hent sagsdeltagere | Bruger med relation til sagen; kun de sagsdeltagere brugerens rolle giver adgang til |
        | Opdater sagsdeltager | Kun den indloggede brugers egen sagsdeltager (inkl. rollen INDSENDER) |
        | Skriv til retten | Bruger med relation til sagen; kun egne uploadede bilag på sagen |
        | Hent og besvar frister | Kun modtagere af fristen (frister er tiltænkt bestemte roller) |
        | Hent krav og tilgodehavender | Likvidator: alle; kreditor: kun egne; øvrige: ingen |
        | Anmeld, opdater og slet krav og tilgodehavender | Kreditor (tilgodehavende kan registreres uden eksisterende relation) |
        | Anmeld nulkrav | Gældsstyrelsen |

        Et token udstedes af login-tjenesten og har begrænset levetid; et udløbet eller ugyldiggjort token giver 401, og klienten skal hente et nyt token.
  parameters:
    sagId:
      name: sagId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
    fristId:
      name: fristId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
    kravId:
      name: kravId
      in: path
      required: true
      description: Kravets tekniske ID. Returneres når krav oprettes eller hentes
        (feltet kravId i V2).
      schema:
        $ref: '#/components/schemas/id'
    tilgodehavendeId:
      name: tilgodehavendeId
      in: path
      required: true
      description: Tilgodehavendets tekniske ID. Returneres når tilgodehavender oprettes
        eller hentes (feltet tilgodehavendeId i V2).
      schema:
        $ref: '#/components/schemas/id'
    sagsdeltagerId:
      name: sagsdeltagerId
      in: path
      required: true
      description: Teknisk ID på sagsdeltageren. Returneres i listen af sagsdeltagere
        på sagen, angivet som 'sagsdeltagerId'.
      schema:
        $ref: '#/components/schemas/id'
    pageV2:
      name: page
      in: query
      required: false
      description: Sideindeks, 0-baseret (første side er 0). Ugyldig værdi (negativ
        eller ikke et heltal) giver 400.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    sizeV2:
      name: size
      in: query
      required: false
      description: Antal elementer pr. side (1-100, default 20). Værdier uden for
        intervallet giver 400.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    directionV2:
      name: direction
      in: query
      required: false
      description: Sorteringsretning. Default er DESC (nyeste/største først). Gælder
        alle felter i sort.
      schema:
        allOf:
        - $ref: '#/components/schemas/directionEnum'
        default: DESC
    sortKravV2:
      name: sort
      in: query
      required: false
      description: 'Felter der sorteres på (gentag parameteren for flere felter).
        Gyldige værdier: oprettelsestidspunkt (default), redigeringstidspunkt, beloeb,
        gebyrOgRente, opgjortdato. Ukendt feltnavn giver 400.'
      schema:
        type: array
        items:
          type: string
        default:
        - oprettelsestidspunkt
    sortTilgodehavenderV2:
      name: sort
      in: query
      required: false
      description: 'Felter der sorteres på (gentag parameteren for flere felter).
        Gyldige værdier: oprettelsestidspunkt (default), redigeringstidspunkt, beloeb.
        Ukendt feltnavn giver 400.'
      schema:
        type: array
        items:
          type: string
        default:
        - oprettelsestidspunkt
    sortRetsboegerV2:
      name: sort
      in: query
      required: false
      description: 'Felter der sorteres på (gentag parameteren for flere felter).
        Gyldige værdier: rettenSatTidspunkt (default), titel. Ukendt feltnavn giver
        400.'
      schema:
        type: array
        items:
          type: string
        default:
        - rettenSatTidspunkt
    page:
      name: page
      description: Side for paginering.
      required: false
      in: query
      schema:
        type: integer
    size:
      name: size
      description: Antal elementer pr. side.
      required: false
      in: query
      schema:
        type: integer
    sort:
      name: sort
      description: Liste af felter der skal sorteres på.
      required: false
      in: query
      schema:
        type: array
        items:
          type: string
    direction:
      name: direction
      description: Stigende eller faldende retning for søgeresultater.
      in: query
      schema:
        $ref: '#/components/schemas/directionEnum'
  responses:
    badRequest:
      description: 'Ugyldigt kald: validering af request eller en forretningsregel
        er brudt. apiError.status er 400, og apiError.errorDetails[].code indeholder
        forretningskoden (fx aktion.ekstern.haandter.frist.ikke.modtager).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
          example:
            code: 400
            status: 400
            message: Ugyldigt kald
            path: /v2/insolvenssagerEkstern/1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
            timestamp: '2026-03-01T09:15:00.000+01:00'
            errorDetails:
            - message: Besvarelsen skal indeholde fritekst eller mindst ét bilag
              code: aktion.ekstern.haandter.frist.ugyldig.besvarelse
    unauthorized:
      description: Manglende eller ugyldigt bearer-token (JWT).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    forbidden:
      description: Tokenet har ikke en rolle der må kalde endpointet (PROFESSIONEL,
        ADGANGSPROFILDELTAGER, PERSON eller VIRKSOMHED), eller brugeren har en relation
        til sagen men må ikke udføre handlingen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
          example:
            code: 403
            status: 403
            message: Adgang nægtet
            path: /v2/insolvenssagerEkstern/1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
            timestamp: '2026-03-01T09:15:00.000+01:00'
            errorDetails:
            - message: Brugeren må ikke udføre handlingen
              code: adgang.naegtet
    conflict:
      description: Handlingen er i konflikt med sagens eller objektets aktuelle tilstand,
        fx allerede besvaret/behandlet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    internalServerError:
      description: Uventet fejl i tjenesten.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    genericErrorResponse:
      description: Svar ved fejl.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
