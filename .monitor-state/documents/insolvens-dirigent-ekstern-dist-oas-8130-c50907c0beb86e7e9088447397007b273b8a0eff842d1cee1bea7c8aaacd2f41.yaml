    struktureretDanskAdresse:
      description: Dansk struktureret adresse.
      x-namespace: dk.domstol.oas.common.adressev2
      required:
      - adresselinje
      - postnummer
      - postdistrikt
      properties:
        darId:
          $ref: '#/components/schemas/id'
        adresselinje:
          type: string
        postnummer:
          type: string
        postdistrikt:
          description: Navnet på postnummeret. Dette fremstilles typisk som sidste
            led, fx 2630 Taastrup.
          type: string
        supplerendeBynavn:
          description: 'Optionelt felt - typisk landsbyens navn eller andet lokalt
            stednavn der er fastsat af kommunen for at præcisere adressens beliggenhed
            indenfor postnummeret. Indgår som en del af den officielle adressebetegnelse.
            Indtil 34 tegn. Eksempel: ”Sønderholm”.'
          type: string
          maxLength: 34
    fritekstadresse:
      description: Danske eller udenlandsk adresse i fritekstform.
      x-namespace: dk.domstol.oas.common.adressev2
      required:
      - adresselinje1
      properties:
        adresselinje1:
          type: string
          maxLength: 200
        adresselinje2:
          type: string
          maxLength: 200
        adresselinje3:
          type: string
          maxLength: 200
        adresselinje4:
          type: string
          maxLength: 200
        adresselinje5:
          type: string
          maxLength: 200
        landekode:
          $ref: '#/components/schemas/landekodeEnum'
    adresse:
      description: Wrapper til adresser af forskellige typer.
      x-namespace: dk.domstol.oas.common.adressev2
      required:
      - adressetype
      properties:
        struktureretDanskAdresse:
          $ref: '#/components/schemas/struktureretDanskAdresse'
        fritekstadresse:
          $ref: '#/components/schemas/fritekstadresse'
        adressetype:
          $ref: '#/components/schemas/adressetype'
    adressetype:
      x-namespace: dk.domstol.oas.common.adressev2
      type: string
      enum:
      - STRUKTURERET_DANSK_ADRESSE
      - FRITEKSTADRESSE
      - INGEN_ADRESSE
    partTypeEnum:
      x-namespace: dk.domstol.oas.common
      description: Type af part. Person givet ved CPR-nummer, virksomhed givet ved
        CVR-nummer eller udenlandsk virksomhed eller person.
      type: string
      enum:
      - PERSON
      - VIRKSOMHED
      - UDENLANDSK
    part:
      x-namespace: dk.domstol.oas.common
      description: Part givet ved typen (person, virksomhed eller udenlandsk) og de
        tilhørende underelementer for typen.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/partTypeEnum'
        virksomhed:
          $ref: '#/components/schemas/virksomhedReference'
        person:
          $ref: '#/components/schemas/personReference'
        udenlandsk:
          $ref: '#/components/schemas/fritekstPart'
    personReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til person som har og kan identificeres med et CPR-nr.
      required:
      - personId
      properties:
        personId:
          $ref: '#/components/schemas/id'
    virksomhedReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til virksomhed.
      required:
      - cvrNummer
      properties:
        cvrNummer:
          $ref: '#/components/schemas/cvrNummer'
    fritekstPart:
      x-namespace: dk.domstol.oas.common
      description: Fritekst part (person) givet ved et navn og en adresse. Benyttes
        når personen ikke har et CPR-nr.
      required:
      - navn
      - adresse
      properties:
        navn:
          type: string
          maxLength: 200
        adresse:
          $ref: '#/components/schemas/fritekstadresse'
    partnerReference:
      x-namespace: dk.domstol.oas.common
      description: Reference til partner med et partnerId i partner registeret.
      required:
      - partnerId
      properties:
        partnerId:
          $ref: '#/components/schemas/id'
    systemPart:
      required:
      - name
      properties:
        name:
          type: string
  headers:
    totalCount:
      description: Det totale antal resultater i listen.
      schema:
        type: integer
  requestBodies: {
    }
