      description: En hændelse der er sket på en specifik insolvenssag. Tilsammen
        beskriver de sagens gang / historik, uanset sagstype.
      required:
      - oprettet
      - foretagetAf
      - beskrivelse
      properties:
        oprettet:
          description: Tidspunkt hvor hændelsen fandt sted (date-time med tidszoneoffset,
            se Dato og tid i info.description).
          type: string
          format: date-time
        foretagetAf:
          $ref: '#/components/schemas/haendelsePartEksternV2'
        beskrivelse:
          description: En kort beskrivelse af hvilken hændelse der er tale om - ala
            en titel.
          example: Anmodning om vidneafhøring
          type: string
    retsbogEksternV2:
      description: Retsbog på sagen.
      required:
      - rettenSatTidspunkt
      - titel
      - embedskode
      - reference
      properties:
        rettenSatTidspunkt:
          description: Dato og tidspunkt hvor retten var sat (date-time med tidszoneoffset,
            se Dato og tid i info.description).
          type: string
          format: date-time
        titel:
          description: Retsbogens titel.
          type: string
        embedskode:
          $ref: '#/components/schemas/embedskode'
        reference:
          $ref: '#/components/schemas/dokumentReferenceV2'
    meddelelseV2:
      description: Meddelelse på sagen, dvs. et dokument der er sendt mellem parter
        på sagen. meddelelseTitel angiver dokumentets titel.
      required:
      - meddelelseId
      - reference
      - meddelelseTitel
      - afsender
      - afsendelsesdato
      properties:
        meddelelseId:
          description: Teknisk ID for meddelelsen.
          type: string
          format: uuid
        reference:
          $ref: '#/components/schemas/dokumentReferenceV2'
        meddelelseTitel:
          description: Meddelelsens titel.
          type: string
        afsender:
          description: Navn på afsender, fx person navn eller navn på et embede.
          type: string
        afsendelsesdato:
          description: Dato hvor meddelelsen blev afsendt.
          type: string
          format: date
        modtagerNavn:
          description: Navn på modtageren af meddelelsen.
          type: string
        navneOgAdresseBeskyttet:
          description: For danske personer angives om personen er navne- og adressebeskyttet.
            Øvrige modtagere vil have angivet dette felt som false.
          type: boolean
    besvarelseRequestV2:
      description: Besvarelse med fritekst og bilag. Hvis ingen bilag vedlægges bliver
        fritekst krævet.
      properties:
        fritekst:
          description: Fritekstsvar på fristen.
          type: string
          minLength: 3
          maxLength: 1200
        bilag:
          description: Liste (potentielt tom) af bilag som ekstern bruger ønsker at
            uploade til at understøtte sin besvarelse. Hvert bilag uploades først
            til dokumentlageret, og det returnerede tekniske ID/reference for dokumentet
            anvendes her.
          type: array
          items:
            $ref: '#/components/schemas/dokumentReferenceV2'
    fristEksternV2:
      description: Frist på sagen, tiltænkt den indloggede brugers rolle.
      required:
      - fristId
      - titel
      - fristtype
      - fristdato
      - erAktiv
      properties:
        fristId:
          $ref: '#/components/schemas/id'
        titel:
          description: Fristens brugervendte titel.
          type: string
        fristtype:
          $ref: '#/components/schemas/fristtypeEnumV2'
        fristdato:
          description: Dato for fristens udløb.
          type: string
          format: date
        erAktiv:
          description: False såfremt aktiviteten der skulle udføres er blevet udført,
            eller såfremt fristen er udløbet. Ellers true.
          type: boolean
    fristtypeEnumV2:
      description: |
        Fristtypen anvendes af en ekstern klient til at afgøre hvilket flow der initieres ved klik på fristen.
        Kun typer der kan vises for eksterne brugere indgår. Frister der bruges i Erhvervsstyrelsens interne afvisnings-/tilbagekaldelsesforløb vises aldrig eksternt og er derfor ikke en del af V2.

        | Værdi | Besvarbar via POST .../frister/{fristId} | Forklaring |
        |---|---|---|
        | ERKLAERING | ja | Tidligere ledelse skal afgive erklæring; besvares med fritekst og/eller bilag |
        | REDEGOERELSE | ja | Likvidator skal indsende redegørelse (omfatter også rykker og påmindelse); besvares med fritekst og/eller bilag |
        | FRITEKST | ja | Frist med fri, ekstern titel; besvares med fritekst og/eller bilag |
        | BETAL_KAEREAFGIFT | nej | Frist til betaling af kæreafgift; betalingen sker uden for API'et, og fristen afsluttes af retten |
        | KAEREAFGOERELSE | nej | Kæremål er indgivet og afventer afgørelse; der kan ikke svares på fristen via API'et |
      type: string
      enum:
      - ERKLAERING
      - REDEGOERELSE
      - BETAL_KAEREAFGIFT
      - KAEREAFGOERELSE
      - FRITEKST
    dokumentSamlingEksternV2:
      description: En samling af dokumenter der er tilføjet til sagen i samme aktion,
        fx flere bilag indsendt i samme meddelelse.
      required:
      - samlingTitel
      - dato
      - opretter
      - dokumenter
      properties:
        samlingTitel:
          description: Dokumentsamlingens titel.
          type: string
        dato:
          description: Dato hvor dokumentsamlingen blev tilføjet til sagen. Hvis flere
            dokumenter siden tilføjes vil denne dato forblive uændret.
          type: string
          format: date
        opretter:
          $ref: '#/components/schemas/haendelsePartEksternV2'
        dokumenter:
          description: Dokumenter der indgår i dokumentsamlingen.
          type: array
          items:
            $ref: '#/components/schemas/insolvensDokumentV2'
