openapi: 3.0.3
info:
  title: Insolvens - eksternt API til insolvenssager
  description: |-
    API til eksterne parter (kreditorer, likvidatorer, tidligere ledelse, advokater, myndigheder m.fl.) der skal læse og handle på insolvenssager hos domstolene. Hvad den enkelte bruger kan se og gøre afhænger af brugerens rolle og relation til sagen.

    ## Versioner
    - **V2** (`/v2/...`) er den aktuelle version og dækker alle 7 sagstyper: tvangsopløsning, konkurs, gældssanering, rekonstruktion, forebyggende rekonstruktion, ægtefælleskifte og andre sager efter selskabsloven.
    - **V1** (stier uden `/v2/`) er markeret `deprecated` og udfases efter en overgangsperiode (datoen for endelig udfasning er endnu ikke fastlagt og meldes ud i god tid). Hver V1-operation angiver sin erstatning i V2. Nye integrationer skal bruge V2.

    ## Godkendelse
    Alle kald kræver et bearer-token (JWT). Se sikkerhedsskemaet `bearerAuth` for token-typer og hvem der må kalde hvad.

    ## Fejlhåndtering og adgang
    - 401: manglende eller ugyldigt token.
    - 403: tokenet har ikke en rolle der må kalde endpointet, eller brugeren har en relation til sagen men må ikke udføre handlingen.
    - 404: sagen (eller det tilgåede objekt) findes ikke, eller brugeren har ingen relation til sagen.
    - Filtrerede lister uden match returnerer 200 med tom liste.
    - 400: validering eller forretningsregel brudt; forretningskoden står i apiError.errorDetails[].code.
    - 409: handlingen er i konflikt med objektets aktuelle tilstand.
    - 500: uventet fejl.

    ## Succeskoder uden body
    Endpoints uden svarbody bruger 200 (PUT/DELETE), 201 (POST der opretter, fx besvarelse af frist og nulkrav) og 204 (skriv til retten). Koderne er bevaret og beskrevet eksplicit, da en ensretning er en breaking change for eksisterende klienter.

    ## Bilag og dokumenter
    Bilag og andre dokumenter uploades og hentes via dokumentlagerets API, som ikke er en del af denne specifikation. Et uploadet dokument får et teknisk id, som angives som dokumentReferenceV2.id i de kald her der tager bilag. Størrelses- og filtypekrav samt adgangsregler fastsættes af dokumentlageret. Ved download giver dokumentlageret 403 hvis brugeren ikke har adgang og 404 hvis dokumentet ikke findes.

    ## Dato og tid
    Felter med format date-time er ISO 8601 med tidszoneoffset (UTC eller dansk tid, Europe/Copenhagen); klienter skal tolke offset og ikke antage lokal tid. Felter med format date er kalenderdatoer i dansk tid (Europe/Copenhagen) uden tidszone. Konvention for nye felter er ...dato for date og ...tidspunkt for date-time. Eksisterende afvigelser (fx oprettet, udpeget, fratradt) bevares, da omdøbning er en breaking change.
  version: 8.13.0
  contact:
    name: Domstolene - Insolvens
tags:
- name: insolvensDirigentEkstern
  description: Operationer i det eksterne API til insolvenssager.
paths:
  /tvangsoploesningssagerEkstern/{sagId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentTvangsoploesningssag
      summary: Hent tvangsopløsningssag.
      deprecated: true
      description: Hent specifik tvangsopløsningssag udfra dets sag id (ikke sagsnummer).
        Udgår efter en overgangsperiode (datoen for endelig udfasning er endnu ikke
        fastlagt). Ingen direkte v2-erstatning; brug i stedet GET /v2/insolvenssagerEkstern/{sagId},
        der dækker alle sagstyper.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tvangsoploesningssagEkstern'
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/sagens-gang:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/page'
    - $ref: '#/components/parameters/size'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: getSagensGangListe
      summary: Hent sagens gang.
      deprecated: true
      description: Hent liste (side) af sagens gang hændelser som ekstern (pånær likvidator).
        Udgår efter en overgangsperiode (datoen for endelig udfasning er endnu ikke
        fastlagt). Erstattes af GET /v2/insolvenssagerEkstern/{sagId}/sagens-gang.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/sagensGangBegivenhed'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerTidlLedelse/{sagId}/erklaering:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - insolvensDirigentEkstern
      operationId: postErklaering
      summary: Indsend erklæring.
      deprecated: true
      description: Indsend erklæring. Udgår efter en overgangsperiode (datoen for
        endelig udfasning er endnu ikke fastlagt). Erstattes af POST /v2/insolvenssagerEkstern/{sagId}/skriv-til-retten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/erklaering'
      responses:
        '201':
          description: Erklæring er gemt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/erklaering'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerTidlLedelse/{sagId}/kontaktoplysninger:
    parameters:
    - $ref: '#/components/parameters/sagId'
    put:
      tags:
      - insolvensDirigentEkstern
      operationId: updateKontaktoplysninger
      summary: Opdater kontaktoplysninger.
      deprecated: true
      description: Opdater kontaktoplysningerne for direktøren selv. Udgår efter en
        overgangsperiode (datoen for endelig udfasning er endnu ikke fastlagt). Læsning
        erstattes af GET /v2/insolvenssagerEkstern/{sagId}/sagsdeltagere/{sagsdeltagerId},
        og skrivning erstattes af PUT /v2/insolvenssagerEkstern/{sagId}/sagsdeltagere/{sagsdeltagerId}.
        Den indloggede bruger må kun opdatere egne kontaktoplysninger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kontaktoplysningerOpdatering'
      responses:
        '200':
          description: Kontaktoplysninger er opdateret.
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/kaeremaal:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - insolvensDirigentEkstern
      operationId: opretKaeremaal
      summary: Opret kæremål.
      deprecated: true
      description: Opret kæremål som ekstern til sagen. Udgår efter en overgangsperiode
        (datoen for endelig udfasning er endnu ikke fastlagt) - kæremål videreføres
        IKKE som selvstændigt v2-endpoint. Erstattes af POST /v2/insolvenssagerEkstern/{sagId}/skriv-til-retten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/opretKaeremaal'
      responses:
        '201':
          description: Kæremål oprettet succesfuldt.
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/afgoerelser:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentAfgoerelser
      summary: Hent afgørelser.
      deprecated: true
      description: Hent en liste af afgørelser (retsbøger) på sagen. Udgår efter en
        overgangsperiode (datoen for endelig udfasning er endnu ikke fastlagt) - videreføres
        IKKE som selvstændigt v2-endpoint, da formålet udelukkende var at understøtte
        kæremål (som også udgår). Erstattes af GET /v2/insolvenssagerEkstern/{sagId}/retsboeger.
      responses:
        '200':
          description: Liste af afgørelser på sagen hentet succesfuldt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/afgoerelse'
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/krav:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      operationId: hentKrav
      summary: Hent krav.
      deprecated: true
      description: Hent en side af krav der matcher ønsket sortering, sammen med en
        samlet summering for alle krav. Udgår efter en overgangsperiode (datoen for
        endelig udfasning er endnu ikke fastlagt). Erstattes af GET /v2/tvangsoploesningssagerEkstern/{sagId}/krav,
        hvor resultatet filtreres efter brugerens relation til sagen.
      responses:
        '200':
          description: Side af krav hentet med succes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kravListe'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/tilgodehavender:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      operationId: hentTilgodehavender
      summary: Hent tilgodehavender.
      deprecated: true
      description: Hent en side af tilgodehavender der matcher ønsket sortering, sammen
        med en samlet summering for alle tilgodehavender. Udgår efter en overgangsperiode
        (datoen for endelig udfasning er endnu ikke fastlagt). Erstattes af GET /v2/tvangsoploesningssagerEkstern/{sagId}/tilgodehavender,
        hvor resultatet filtreres efter brugerens relation til sagen.
      responses:
        '200':
          description: Side af tilgodehavender hentet med succes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tilgodehavendeListe'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/retsboeger:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      operationId: hentRetsboeger
      summary: Hent retsbøger.
      deprecated: true
      description: Hent en side af retsbøger der matcher ønsket sortering. Udgår efter
        en overgangsperiode (datoen for endelig udfasning er endnu ikke fastlagt).
        Erstattes af GET /v2/insolvenssagerEkstern/{sagId}/retsboeger.
      responses:
        '200':
          description: Side af retsbøger hentet med succes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/retsbogEkstern'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/meddelelser:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentMeddelelser
      summary: Hent meddelelser.
      deprecated: true
      description: Hent alle meddelelser til brugeren på sagen. Udgår efter en overgangsperiode
        (datoen for endelig udfasning er endnu ikke fastlagt). Erstattes af GET /v2/insolvenssagerEkstern/{sagId}/meddelelser.
      responses:
        '200':
          description: Meddelelser hentet med succes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/detaljeretMeddelelse'
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /tvangsoploesningssagerEkstern/{sagId}/frister/{fristId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/fristId'
    post:
      tags:
      - insolvensDirigentEkstern
      operationId: haandterFrist
      summary: Besvar frist.
      deprecated: true
      description: Håndter manuelt oprettet frist. Udgår efter en overgangsperiode
        (datoen for endelig udfasning er endnu ikke fastlagt). Erstattes af POST /v2/insolvenssagerEkstern/{sagId}/frister/{fristId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/besvarelseRequest'
      responses:
        '201':
          description: Besvarelse er gemt.
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/insolvenssagerEkstern:
    post:
      tags:
      - insolvensDirigentEkstern
      operationId: opretInsolvenssagEksternV2
      summary: Opret insolvenssag.
      description: Opret en ny insolvenssag som ekstern bruger. Sager af typen TVANGSOPLOESNING
        kan ikke oprettes via dette endpoint, da tvangsopløsningssager oprettes af
        Erhvervsstyrelsen. Succes returnerer 201 med den oprettede sag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/opretInsolvenssagEksternV2'
      responses:
        '201':
          description: Insolvenssag er oprettet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oprettetInsolvenssagEksternV2'
        '400':
          description: 'Ugyldigt kald. Forretningskode i apiError.errorDetails[].code:
            embedskode.ikke.fundet (retskreds findes ikke). Øvrige valideringsfejl
            på requestbody giver også 400.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/insolvenssagerEkstern/{sagId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentInsolvenssagEksternV2
      summary: Hent insolvenssag.
      description: Hent specifik insolvenssag udfra dets sagId (ikke sagsnummer),
        uanset sagstype. Erstatter GET /tvangsoploesningssagerEkstern/{sagId}, men
        dækker alle 7 sagstyper.
      responses:
        '200':
          description: Insolvenssagen hentet med succes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/insolvenssagEksternV2'
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 404
                status: 404
                message: Sagen findes ikke
                path: /v2/insolvenssagerEkstern/1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
                timestamp: '2026-03-01T09:15:00.000+01:00'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/insolvenssagerEkstern/{sagId}/sagsdeltagere:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/pageV2'
    - $ref: '#/components/parameters/sizeV2'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentSagsdeltagereEksternV2
      summary: Hent sagsdeltagere.
      description: Hent (en side af) de sagsdeltagere på sagen som den indloggede
        eksterne bruger har adgang til at se. Adgangen er rollebaseret - listen filtreres
        serverside efter hvilken relation den indloggede bruger selv har til sagen
        og er derfor IKKE nødvendigvis alle sagsdeltagere på sagen. Paginering via
        page/size (0-baseret, size 1-100, default 20); listen kan ikke sorteres via
        API'et. Ugyldige pagineringsparametre giver 400.
      responses:
        '200':
          description: Side af sagsdeltagere hentet med succes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/sagsdeltagerEksternV2'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 404
                status: 404
                message: Sagen findes ikke
                path: /v2/insolvenssagerEkstern/1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed/sagsdeltagere
                timestamp: '2026-03-01T09:15:00.000+01:00'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/insolvenssagerEkstern/{sagId}/sagsdeltagere/{sagsdeltagerId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/sagsdeltagerId'
    get:
      tags:
      - insolvensDirigentEkstern
      operationId: hentSagsdeltagerEksternV2
      summary: Hent sagsdeltager.
      description: Hent en specifik sagsdeltager på sagen. Kun tilgængelig hvis den
        indloggede eksterne bruger har adgang til at se netop denne sagsdeltager (rollebaseret).
        Erstatter læsning af GET /tvangsoploesningssagerTidlLedelse/{sagId}/kontaktoplysninger
        for egne kontaktoplysninger.
      responses:
        '200':
          description: Sagsdeltager hentet med succes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sagsdeltagerEksternV2'
        '404':
          description: Sagen eller sagsdeltageren findes ikke, eller den indloggede
            bruger har ikke adgang til at se denne sagsdeltager.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 404
                status: 404
                message: Sagen findes ikke
                path: /v2/insolvenssagerEkstern/1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed/sagsdeltagere/6ec0bd7f-11c0-43da-975e-2a8ad9ebae0b
                timestamp: '2026-03-01T09:15:00.000+01:00'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internalServerError'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    put:
      tags:
      - insolvensDirigentEkstern
      operationId: opdaterSagsdeltagerKontaktoplysningerEksternV2
      summary: Opdater egne kontaktoplysninger som sagsdeltager.
      description: Opdater kontaktoplysningerne for sig selv som sagsdeltager. Kan
        kun bruges til at opdatere den indloggede brugers egen sagsdeltager-post,
        ikke andres; en bruger med rollen INDSENDER må også opdatere. PUT har fuld-erstatningssemantik
        for kontaktoplysningerne, så felter der udelades eller er null nulstilles.
        403 gives når brugeren har relation til sagen men ikke må opdatere den pågældende
        sagsdeltager; 404 når sagen eller sagsdeltageren ikke findes eller er skjult
        for brugeren. Erstatter skrivning via PUT /tvangsoploesningssagerTidlLedelse/{sagId}/kontaktoplysninger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/opdaterSagsdeltagerKontaktoplysningerEksternV2'
      responses:
        '200':
          description: Kontaktoplysninger er opdateret (200 uden body).
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          description: Sagen eller sagsdeltageren findes ikke, eller brugeren har
            ingen relation til sagen eller til sagsdeltageren.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 404
