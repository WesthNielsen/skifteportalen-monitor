    insolvenssagTypeEksternV2:
      description: Sagstype for en insolvenssag, dækkende alle 7 sagstyper der understøttes
        af v2-API'et.
      type: string
      enum:
      - TVANGSOPLOESNING
      - KONKURS
      - GAELDSSANERING
      - REKONSTRUKTION
      - FOREBYGGENDE_REKONSTRUKTION
      - AEGTEFAELLESKIFTE
      - ANDRE_SAGER_EFTER_SELSKABSLOVEN
    sagsdeltagerEksternV2:
      description: Sagsdeltager på en insolvenssag. Hvilke sagsdeltagere og felter
        den enkelte eksterne bruger kan se, afhænger af brugerens rolle på sagen iht.
        rettighedsmatricen (Confluence/Excel Source of Truth).
      example:
        sagsdeltagerId: 6ec0bd7f-11c0-43da-975e-2a8ad9ebae0b
        navn: Eksempel A/S
        cvrNummer: '12345678'
        reklamebeskyttet: false
        type: VIRKSOMHED
        rolle: SELSKAB
        gruppe: HOVEDPART
        passiveret: false
        sagsdeltagerReference: J-2026-0042
        kontaktoplysninger:
          navn: Anne Sekretær
          telefonnummer: '+4512345678'
          email: kontakt@eksempel.dk
      required:
      - sagsdeltagerId
      - type
      - rolle
      - gruppe
      - passiveret
      properties:
        sagsdeltagerId:
          $ref: '#/components/schemas/id'
        navn:
          description: Navn på personen (fulde navn hvis angivet, ellers navn fra
            CPR), virksomheden eller det embede sagsdeltageren repræsenterer. Er ikke
            required, da navnet udelades eller er null for roller der ikke må se det
            (fx brugere uden rolle på sagen, eller når en anden sagsdeltager/repræsentant
            har navne- og adressebeskyttelse og ses af en rolle uden adgang; hovedpartens
            og rettens udpegedes navn vises dog uanset navne- og adressebeskyttelse).
          type: string
        cvrNummer:
          $ref: '#/components/schemas/cvrNummer'
          description: CVR-nummer for virksomheden, rettens udpegedes firma eller
            en personskyldner med enkeltmandsvirksomhed. Udelades hvis ikke relevant
            eller skjult for brugerens rolle.
        type:
          $ref: '#/components/schemas/sagsdeltagerTypeEksternV2'
        rolle:
          $ref: '#/components/schemas/sagsdeltagerRolleEnumEksternV2'
        fritekstRolle:
          description: Fritekst-beskrivelse af rollen, kun udfyldt hvis rolle er ANDEN_SAGSDELTAGER
            eller ANDEN_REPRAESENTANT.
          type: string
        gruppe:
          $ref: '#/components/schemas/sagsdeltagerGruppeEksternV2'
        passiveret:
          description: Angiver om sagsdeltageren er passiveret (ikke længere aktiv
            på sagen). Passiverede sagsdeltagere udstilles ikke til eksterne brugere.
          type: boolean
        navnOgAdresseBeskyttet:
          description: Angiver om sagsdeltageren har beskyttet navn og adresse i CPR.
            Optræder kun for personer.
          type: boolean
        reklamebeskyttet:
          description: Angiver om virksomheden er reklamebeskyttet i CVR. Optræder
            kun for virksomheder (eller personskyldner med CVR).
          type: boolean
        sagsdeltagerReference:
          description: Sagsdeltagerens eget journalnummer (j.nr.), myndigheds sagsnummer
            eller lignende reference på sagen. Udelades hvis ikke angivet eller skjult
            for brugerens rolle.
          type: string
        rolleDetaljer:
          $ref: '#/components/schemas/sagsdeltagerRolleDetaljerEksternV2'
        adresse:
          $ref: '#/components/schemas/sagsdeltagerAdresseEksternV2'
          description: Primær adresse (CPR-, CVR- eller firmaadresse) for sagsdeltageren
            inkl. markering af hemmelig adresse.
        andenAdresse:
          description: Eventuelle alternative adresser for sagsdeltageren.
          type: array
          items:
            $ref: '#/components/schemas/sagsdeltagerAdresseEksternV2'
        kontaktoplysninger:
          $ref: '#/components/schemas/sagsdeltagerKontaktoplysningerEksternV2'
          description: Sagsdeltagerens egne kontaktoplysninger (telefonnummer og email
            samt evt. kontaktpersonens navn).
        repraesentanter:
          description: Sagsdeltagere der repræsenterer denne sagsdeltager, fx en advokat
            eller anden mandatar.
          type: array
          items:
            $ref: '#/components/schemas/repraesentantEksternV2'
        repraesentererSagsdeltagerId:
          description: Sagsdeltager-ID på den eller de sagsdeltagere på sagen, som
            denne sagsdeltager er repræsentant for (kun udfyldt når gruppe er REPRAESENTANT).
          type: array
          items:
            $ref: '#/components/schemas/id'
    repraesentantEksternV2:
      description: Repræsentant for en sagsdeltager, fx en advokat eller anden mandatar.
        Har samme felter som sagsdeltagerEksternV2, men uden yderligere repræsentanter
        (dybden er begrænset til ét led).
      required:
      - sagsdeltagerId
      - type
      - rolle
      - gruppe
      - passiveret
      properties:
        sagsdeltagerId:
          $ref: '#/components/schemas/id'
        navn:
          description: Navn på personen (fulde navn hvis angivet, ellers navn fra
            CPR), virksomheden eller det embede repræsentanten repræsenterer. Er ikke
            required, da navnet udelades eller er null når repræsentanten er en person
            med navne- og adressebeskyttelse og ses af en rolle der ikke må se navnet
            (fx rekvirent eller anden sagsdeltager).
          type: string
        cvrNummer:
          $ref: '#/components/schemas/cvrNummer'
          description: CVR-nummer hvis repræsentanten er en virksomhed (fx advokatfirma).
            Udelades hvis ikke relevant eller skjult for brugerens rolle.
        type:
          $ref: '#/components/schemas/sagsdeltagerTypeEksternV2'
        rolle:
          $ref: '#/components/schemas/sagsdeltagerRolleEnumEksternV2'
        fritekstRolle:
          description: Fritekst-beskrivelse af rollen, kun udfyldt hvis rolle er ANDEN_SAGSDELTAGER
            eller ANDEN_REPRAESENTANT.
          type: string
        gruppe:
          $ref: '#/components/schemas/sagsdeltagerGruppeEksternV2'
        passiveret:
          description: Angiver om repræsentanten er passiveret (ikke længere aktiv
            på sagen).
          type: boolean
        navnOgAdresseBeskyttet:
          description: Angiver om repræsentanten har beskyttet navn og adresse i CPR.
            Optræder kun for personer.
          type: boolean
        reklamebeskyttet:
          description: Angiver om repræsentantens virksomhed er reklamebeskyttet i
            CVR. Optræder kun for virksomheder.
          type: boolean
        sagsdeltagerReference:
          description: Repræsentantens journalnummer (j.nr.) eller lignende reference
            på sagen. Udelades hvis ikke angivet eller skjult for brugerens rolle.
          type: string
        rolleDetaljer:
          $ref: '#/components/schemas/sagsdeltagerRolleDetaljerEksternV2'
        adresse:
          $ref: '#/components/schemas/sagsdeltagerAdresseEksternV2'
          description: Primær adresse (CPR- eller CVR-adresse) for repræsentanten
            inkl. markering af hemmelig adresse.
        andenAdresse:
          description: Eventuelle alternative adresser for repræsentanten.
          type: array
          items:
            $ref: '#/components/schemas/sagsdeltagerAdresseEksternV2'
        kontaktoplysninger:
          $ref: '#/components/schemas/sagsdeltagerKontaktoplysningerEksternV2'
    sagsdeltagerTypeEksternV2:
      description: Overordnet type af sagsdeltager (person, virksomhed eller anden
        part).
      type: string
      enum:
      - PERSON
      - VIRKSOMHED
      - ANDEN
    sagsdeltagerRolleEnumEksternV2:
      description: |
        Rollen en sagsdeltager har på sagen. Hver rolle tilhører præcis én gruppe (se sagsdeltagerGruppeEksternV2):

        | Gruppe | Roller |
        |---|---|
        | HOVEDPART | SKYLDNER, SELSKAB, MODPART, ANSOEGER, ANMODER |
        | OEVRIG_PART | LEDELSE, DIREKTOER, BESTYRELSESFORMAND, BESTYRELSESMEDLEM, TIDLIGERE_LEDELSE, TIDLIGERE_DIREKTOER, TIDLIGERE_BESTYRELSESFORMAND, TIDLIGERE_BESTYRELSESMEDLEM, TIDLIGERE_LIKVIDATOR, REKVIRENT |
        | REPRAESENTANT | ADVOKAT, MANDATAR, VAERGE, ANDEN_REPRAESENTANT |
        | RETTENS_UDPEGEDE | LIKVIDATOR, REKONSTRUKTOER, KURATOR, AD_HOC_KURATOR, BOBEHANDLER, MEDHJAELPER |
        | ANDEN_SAGSDELTAGER | KREDITOR, REVISOR, ANDEN_SAGSDELTAGER, INDSENDER |

        INDSENDER er den der har indsendt sagen (fx anmodningen). MEDHJAELPER er en medhjælper til en af rettens udpegede (fx kurators medhjælper) og udstilles, da den kan forekomme på sagen.
      type: string
      enum:
      - SKYLDNER
      - SELSKAB
      - REKVIRENT
      - ANSOEGER
      - ANMODER
      - MODPART
      - ADVOKAT
      - MANDATAR
      - VAERGE
      - LEDELSE
      - DIREKTOER
      - BESTYRELSESFORMAND
      - BESTYRELSESMEDLEM
      - TIDLIGERE_LEDELSE
      - TIDLIGERE_DIREKTOER
      - TIDLIGERE_BESTYRELSESFORMAND
      - TIDLIGERE_BESTYRELSESMEDLEM
      - TIDLIGERE_LIKVIDATOR
      - REVISOR
      - KREDITOR
      - ANDEN_SAGSDELTAGER
      - ANDEN_REPRAESENTANT
      - LIKVIDATOR
      - REKONSTRUKTOER
      - KURATOR
      - AD_HOC_KURATOR
      - BOBEHANDLER
      - MEDHJAELPER
      - INDSENDER
    sagsdeltagerGruppeEksternV2:
      description: Overordnet gruppering af sagsdeltagerens rolle. Hvilken gruppe
        en rolle tilhører fremgår af tabellen under sagsdeltagerRolleEnumEksternV2.
      type: string
      enum:
      - HOVEDPART
      - OEVRIG_PART
      - REPRAESENTANT
      - RETTENS_UDPEGEDE
      - ANDEN_SAGSDELTAGER
    sagsdeltagerAdresseEksternV2:
      description: Adresse for en sagsdeltager. Hvis adressen er hemmelig eller beskyttet
        og læserens rolle ikke må se selve adressen, udelades adresse mens adresseHemmelig
        angiver beskyttelsen.
      type: object
      required:
      - adresseHemmelig
      properties:
        adresse:
          $ref: '#/components/schemas/adresse'
        adresseHemmelig:
          description: Angiver om adressen er hemmelig eller ej.
          type: boolean
    sagsdeltagerKontaktoplysningerEksternV2:
      description: Kontaktoplysninger (navn, telefonnummer og/eller email) for en
        sagsdeltager.
      properties:
        navn:
          description: Navn på fx sekretæren hos et advokatfirma.
          type: string
          maxLength: 100
        telefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        email:
          $ref: '#/components/schemas/email'
    sagsdeltagerRolleDetaljerEksternV2:
      description: Rollespecifikke detaljer. Præcis én variant returneres, og discriminatoren
        rolleDetaljerType (RETTENS_UDPEGEDE eller LEDELSESMEDLEM) afgør hvilken.
      type: object
      oneOf:
      - $ref: '#/components/schemas/rettensUdpegedeRolleDetaljerEksternV2'
      - $ref: '#/components/schemas/ledelsesmedlemRolleDetaljerEksternV2'
      discriminator:
        propertyName: rolleDetaljerType
        mapping:
          RETTENS_UDPEGEDE: '#/components/schemas/rettensUdpegedeRolleDetaljerEksternV2'
          LEDELSESMEDLEM: '#/components/schemas/ledelsesmedlemRolleDetaljerEksternV2'
    rettensUdpegedeRolleDetaljerEksternV2:
      description: Detaljer for rettens udpegede roller, fx likvidator, kurator, rekonstruktør
        eller bobehandler.
      type: object
      required:
      - rolleDetaljerType
      - aktiv
      - inhabel
      properties:
        rolleDetaljerType:
          description: Altid RETTENS_UDPEGEDE for denne variant (discriminator).
          type: string
          pattern: ^RETTENS_UDPEGEDE$
        aktiv:
          description: Angiver om den af retten udpegede aktuelt er aktiv i rollen
            på sagen.
          type: boolean
        inhabel:
          description: Angiver om den af retten udpegede er registreret som inhabil
            på sagen.
          type: boolean
        firmanavn:
          description: Navn på det advokatfirma eller den virksomhed, som den af retten
            udpegede tilhører.
          type: string
        kontaktperson:
          $ref: '#/components/schemas/sagsdeltagerKontaktoplysningerEksternV2'
          description: Sekretær eller anden kontaktperson hos den af retten udpegede
            (navn, telefonnummer og email). Udelades for indsender og brugere uden
            rolle på sagen.
        udpeget:
          description: Tidspunkt hvor sagsdeltageren blev udpeget (date-time med tidszoneoffset,
            se Dato og tid i info.description).
          type: string
          format: date-time
        fratradt:
          description: Tidspunkt hvor sagsdeltageren fratrådte (date-time med tidszoneoffset,
            se Dato og tid i info.description).
          type: string
          format: date-time
    ledelsesmedlemRolleDetaljerEksternV2:
      description: Detaljer for ledelsesmedlemmer, fx direktør eller bestyrelsesmedlem.
      type: object
      required:
      - rolleDetaljerType
      properties:
        rolleDetaljerType:
          description: Altid LEDELSESMEDLEM for denne variant (discriminator).
          type: string
          pattern: ^LEDELSESMEDLEM$
        tiltraadt:
          description: Dato hvor ledelsesmedlemmet tiltrådte.
          type: string
          format: date
        fratradt:
          description: Dato hvor ledelsesmedlemmet fratrådte.
          type: string
          format: date
    opdaterSagsdeltagerKontaktoplysningerEksternV2:
      description: Opdatering af egne kontaktoplysninger som sagsdeltager.
      required:
      - kontaktoplysninger
      properties:
        kontaktoplysninger:
          $ref: '#/components/schemas/sagsdeltagerKontaktoplysningerEksternV2'
    skrivTilRettenV2:
      description: Data til en skrivelse til retten. Emnet vælges via emneKey fra
        emne-kataloget. Der skal angives tekst eller mindst ét bilag (valideres af
        tjenesten).
      type: object
      additionalProperties: false
      required:
      - emneKey
      properties:
        emneKey:
          description: Den tekniske nøgle for det valgte emne fra emne-kataloget.
          type: string
          minLength: 1
          example: ANMODNING__AKTINDSIGT
        fritekstEmne:
          description: Kort fritekstemne. Må kun angives når emneKey er ANDET__FRITEKST.
          type: string
          maxLength: 50
        tekst:
          description: Skrivelsens tekst.
          type: string
          maxLength: 3000
        dokumenter:
          description: Liste af bilag der ønskes vedhæftet skrivelsen. Hvert bilag
            uploades først til dokumentlageret, og det returnerede tekniske ID/reference
            for dokumentet anvendes her.
          type: array
          items:
            $ref: '#/components/schemas/dokumentReferenceV2'
    skrivTilRettenEmneV2:
      description: En valgmulighed (kategori og emne) til skriv til retten.
      required:
      - kategori
      - emne
      - key
      properties:
        kategori:
          description: Den brugerrettede kategori som emnet tilhører.
          type: string
          example: Anmodning
        emne:
          description: Det brugerrettede emne.
          type: string
          example: Aktindsigt
        key:
          description: Den stabile tekniske nøgle der sendes som emneKey ved oprettelse
            af skrivelsen.
          type: string
          example: ANMODNING__AKTINDSIGT
    kontaktoplysningerV2:
      description: Kontaktoplysninger (email adresse og/eller telefonnummer) for en
        person eller virksomhed.
      properties:
        telefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        email:
          $ref: '#/components/schemas/email'
    insolvensDokumentV2:
      description: Dokument relateret til insolvens.
      required:
      - reference
      - type
      properties:
        reference:
          $ref: '#/components/schemas/dokumentReferenceV2'
        type:
          $ref: '#/components/schemas/insolvensDokumentTypeV2'
    haendelsePartEksternV2:
      description: Part der har udført en hændelse eller oprettet en dokumentsamling
        på sagen. Feltet type angiver partstypen. Hvis en domstolsmedarbejder har
        foretaget handlingen, angives retskredsens embedskode i feltet intern. Person-
        og fritekstdetaljer udleveres kun, når den indloggede bruger har adgang til
        at se parten.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/haendelsePartTypeV2'
        virksomhed:
          $ref: '#/components/schemas/virksomhedReference'
        person:
          $ref: '#/components/schemas/personReference'
        fritekst:
          $ref: '#/components/schemas/fritekstPart'
        partner:
          $ref: '#/components/schemas/partnerReference'
        intern:
          $ref: '#/components/schemas/embedskode'
        system:
          $ref: '#/components/schemas/systemPart'
    tredjepartV2:
      description: Tredjepart for krav (kreditor) og tilgodehavender (debitor) der
        indberettes på vegne af.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/tredjepartTypeEnumV2'
        virksomhed:
          $ref: '#/components/schemas/virksomhedReference'
        anden:
          $ref: '#/components/schemas/fritekstPart'
    sikkerhedV2:
      description: Sikkerhed for et krav (pant eller ejendomsforbehold).
      required:
      - sikkerhedsform
      properties:
        sikkerhedsform:
          $ref: '#/components/schemas/sikkerhedsformEnumV2'
        pantTekst:
          description: Beskrivelse af det pantsatte eller omfattede aktiv.
          maxLength: 500
          type: string
    danskAdresseV2:
      description: Dansk adresse.
      required:
      - adresselinje
      - postnummer
      - by
      properties:
        adresselinje:
          description: Gadenavn, husnummer, etage m.v.
          type: string
          maxLength: 255
        postnummer:
          description: Dansk postnummer (4 cifre).
          type: string
          maxLength: 4
        by:
          description: Bynavn.
          type: string
          maxLength: 255
    andenAdresseV2:
      description: Evt. anden adresse for en person eller virksomhed.
      required:
      - danskAdresse
      properties:
        careOf:
          description: C/o felt.
          type: string
          maxLength: 200
        danskAdresse:
          $ref: '#/components/schemas/danskAdresseV2'
    nulkravOpdateringV2:
      description: Oprettelse eller opdatering af nulkrav.
      properties:
        bemaerkninger:
          description: Eventuelle bemærkninger til nulkravet.
          type: string
          maxLength: 1200
        bilag:
          description: Liste (potentielt tom) af bilag som Gældsstyrelsen ønsker at
            uploade til at understøtte nul-kravet. Hvert bilag uploades først til
            dokumentlageret, og det returnerede tekniske ID/reference for dokumentet
            anvendes her.
          type: array
          items:
            $ref: '#/components/schemas/dokumentReferenceV2'
    directionEnum:
      x-namespace: dk.domstol.oas.common
      type: string
      enum:
      - ASC
      - DESC
    id:
      type: string
      format: uuid
    cvrNummer:
      type: string
      pattern: ^[1-9][0-9]{7}$
    email:
      type: string
      format: email
      maxLength: 128
    telefonnummer:
      type: string
      pattern: ^\+?\d*$
      maxLength: 20
    oprettelsestidspunkt:
      type: string
      format: date-time
    redigeringstidspunkt:
      type: string
      format: date-time
    embedskode:
      description: Unik forkortelse for et givent embede, der kan anvendes til identificering
        af et specifik embede i retskreds-service.
      type: string
      pattern: ^[A-ZÆØÅ]{3}$
      maxLength: 3
      minLength: 3
    positivtDecimaltal:
      type: number
      minimum: 0.01
    positivtDecimaltalEllerNul:
      type: number
      minimum: 0
    apiError:
      x-namespace: dk.domstol.oas.common
      required:
      - code
      - status
      - message
      - path
      - timestamp
      properties:
        code:
          description: Human readable HTTP status message.
          type: integer
        status:
          description: HTTP status code.
          type: integer
        message:
          description: Message describing the error.
          type: string
        path:
          description: The path of the error.
          type: string
        timestamp:
          description: Date and time of the error.
          type: string
          format: date-time
        details:
          description: Detailed description of the error(s).
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/details'
        errorDetails:
          description: Detailed description of the error(s).
          type: array
          items:
            $ref: '#/components/schemas/details'
    details:
      required:
      - message
      properties:
        message:
          type: string
        code:
          type: string
