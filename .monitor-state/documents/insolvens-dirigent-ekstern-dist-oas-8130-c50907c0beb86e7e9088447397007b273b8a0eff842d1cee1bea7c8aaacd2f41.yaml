        dekretdato:
          description: Dato hvor konkursdekretet blev afsagt.
          type: string
          format: date
    gaeldssaneringInsolvenssagDetaljerEksternV2:
      type: object
      description: Detaljer specifikke for gældssaneringssager.
      required:
      - detaljerType
      properties:
        detaljerType:
          description: Altid GAELDSSANERING for denne variant (discriminator).
          type: string
          pattern: ^GAELDSSANERING$
        indledningsdato:
          description: Dato hvor gældssaneringssagen blev indledt.
          type: string
          format: date
    rekonstruktionInsolvenssagDetaljerEksternV2:
      type: object
      description: Detaljer specifikke for rekonstruktionssager.
      required:
      - detaljerType
      properties:
        detaljerType:
          description: Altid REKONSTRUKTION for denne variant (discriminator).
          type: string
          pattern: ^REKONSTRUKTION$
        indledningsdato:
          description: Dato hvor rekonstruktionsbehandlingen blev indledt.
          type: string
          format: date
    forebyggendeRekonstruktionInsolvenssagDetaljerEksternV2:
      type: object
      description: Detaljer specifikke for forebyggende rekonstruktionssager.
      required:
      - detaljerType
      properties:
        detaljerType:
          description: Altid FOREBYGGENDE_REKONSTRUKTION for denne variant (discriminator).
          type: string
          pattern: ^FOREBYGGENDE_REKONSTRUKTION$
        indledningsdato:
          description: Dato hvor den forebyggende rekonstruktionsbehandling blev indledt.
          type: string
          format: date
    aegtefaelleskifteInsolvenssagDetaljerEksternV2:
      type: object
      description: Detaljer specifikke for ægtefælleskiftesager.
      required:
      - detaljerType
      properties:
        detaljerType:
          description: Altid AEGTEFAELLESKIFTE for denne variant (discriminator).
          type: string
          pattern: ^AEGTEFAELLESKIFTE$
        udleveringsdato:
          description: Dato hvor boet blev udleveret til skifte.
          type: string
          format: date
    andreSagerEfterSelskabslovenInsolvenssagDetaljerEksternV2:
      type: object
      description: Detaljer specifikke for andre sager efter selskabsloven.
      required:
      - detaljerType
      properties:
        detaljerType:
          description: Altid ANDRE_SAGER_EFTER_SELSKABSLOVEN for denne variant (discriminator).
          type: string
          pattern: ^ANDRE_SAGER_EFTER_SELSKABSLOVEN$
        afgoerelsesdato:
          description: Dato hvor afgørelsen i sagen blev truffet.
          type: string
          format: date
    statusEnumEksternV2:
      description: |
        Status i sagens behandling som vist for eksterne. Omfatter 4 åbne sagsstatusser og 49 afslutningsformer (når en sag afsluttes, vises afslutningsformen som sagens status).

        | Værdi | Dansk visningstekst | Kategori |
        |---|---|---|
        | NY_SAG | Ny sag | Åben |
        | UNDER_BEHANDLING | Under behandling | Åben |
        | UDLEVERET | Udleveret | Åben |
        | GENOPTAGET | Genoptaget | Åben |
        | FEJLOPRETTET | Fejloprettet | Afsluttet (fælles) |
        | HENVIST | Henvist | Afsluttet (fælles) |
        | TILBAGEKALDT | Tilbagekaldt | Afsluttet (fælles) |
