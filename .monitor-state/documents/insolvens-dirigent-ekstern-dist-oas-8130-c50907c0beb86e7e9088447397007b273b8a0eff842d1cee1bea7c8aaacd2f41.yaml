    post:
      tags:
      - insolvensDirigentEkstern
      operationId: skrivTilRettenV2
      summary: Skriv til retten.
      description: Send en skrivelse til retten på sagen med et valgt emne og eventuelle
        bilag. Skrivelsen oprettes som et dokument på sagen, og bilagene lægges i
        samme dokumentmappe. Emnet vælges via den tekniske nøgle (emneKey) fra GET
        /v2/insolvenssagerEkstern/{sagId}/skriv-til-retten/emner. Ved emneKey ANDET__FRITEKST
        kan et kort fritekstemne angives i fritekstEmne. Der skal angives tekst eller
        mindst ét bilag. Afsenderen er altid den indloggede bruger. Der oprettes ingen
        henvendelsestråd. Bilag skal være uploadet af den indloggede bruger på sagen;
        andres bilag giver 403. Succes returnerer 204 uden body. Erstatter henvendelser,
        erklæring, redegørelse, konkursbegæring, fristudsættelse, inhabilitet, revisor,
        yderligere likvidatorer og kæremål.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skrivTilRettenV2'
            example:
              emneKey: ANMODNING__AKTINDSIGT
              tekst: Jeg anmoder om aktindsigt i sagen.
      responses:
        '204':
          description: Skrivelsen og eventuelle bilag er oprettet.
        '404':
          description: Sagen findes ikke, eller brugeren har ingen relation til sagen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 404
                status: 404
                message: Sagen findes ikke
                path: /v2/insolvenssagerEkstern/1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed/skriv-til-retten
                timestamp: '2026-03-01T09:15:00.000+01:00'
        '400':
          description: 'Ugyldigt kald. Forretningskoder i apiError.errorDetails[].code:
            skriv.til.retten.emne.ugyldigt, skriv.til.retten.fritekst.emne.paaekraevet,
            skriv.til.retten.fritekst.emne.kun.andet, skriv.til.retten.fritekst.emne.for.langt
            og skriv.til.retten.meddelelse.eller.dokumenter.paaekraevet.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
        '401':
