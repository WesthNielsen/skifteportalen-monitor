openapi: 3.0.3
info:
  title: Api til retskreds.
  description: Api til at hente adresse- og kontaktinformationer for retskredse.
  version: 2.0.0
servers:
- url: http://localhost:8080
paths:
  /retskredse:
    get:
      deprecated: true
      tags:
      - retskreds
      operationId: getAllRetskredse
      summary: Hent liste af retskredse.
      description: Dette endpoint er deprecated. Brug v2-udgaven.
      responses:
        '200':
          description: Hent information om alle retskredse.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/retskreds'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/retskredse:
    get:
      tags:
      - retskreds
      operationId: getAllRetskredseV2
      summary: Hent liste af retskredse.
      responses:
        '200':
          description: Hent information om alle retskredse.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/retskredsV2'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /retskredse/{retskredsId}:
    parameters:
    - $ref: '#/components/parameters/retskredsParameter'
    get:
      deprecated: true
      tags:
      - retskreds
      operationId: getRetskreds
      summary: Hent retskreds med id.
      description: Dette endpoint er deprecated. Brug v2-udgaven.
      responses:
        '200':
          description: Information om retskreds med retskredsId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retskreds'
          links:
            self:
              operationId: hentRetskreds
              parameters:
                retskredsId: $request.path.retskredsId
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/retskredse/{retskredsId}:
    parameters:
    - $ref: '#/components/parameters/retskredsParameter'
    get:
      tags:
      - retskreds
      operationId: getRetskredsV2
      summary: Hent retskreds med id.
      responses:
        '200':
          description: Information om retskreds med retskredsId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retskredsV2'
          links:
            self:
              operationId: hentRetskreds
              parameters:
                retskredsId: $request.path.retskredsId
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /embeder:
    parameters:
    - $ref: '#/components/parameters/retskredsQueryParameter'
    - $ref: '#/components/parameters/sagsomraadeQueryParameter'
    - $ref: '#/components/parameters/instansniveauQueryParameter'
    get:
      deprecated: true
      tags:
      - retskreds
      operationId: findEmbede
      summary: Hent embedet der håndterer et givent sagsområde på et givent instansniveau
        for en given retskreds.
      responses:
        '200':
          description: Hent information om embedet. Dette endpoint er deprecated.
            Brug v2-udgaven.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embede'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/embeder:
    parameters:
    - $ref: '#/components/parameters/retskredsQueryParameter'
    - $ref: '#/components/parameters/sagsomraadeQueryParameter'
    - $ref: '#/components/parameters/instansniveauQueryParameter'
    get:
      tags:
      - retskreds
      operationId: findEmbedeV2
      summary: Hent embedet der håndterer et givent sagsområde på et givent instansniveau
        for en given retskreds.
      responses:
        '200':
          description: Hent information om embedet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embedeV2'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /embeder/{embedskode}:
    parameters:
    - $ref: '#/components/parameters/embedskodeParameter'
    get:
      deprecated: true
      tags:
      - retskreds
      operationId: getEmbede
      summary: Hent embedet ud fra dets embedskode. Dette endpoint er deprecated.
        Brug v2-udgaven.
      responses:
        '200':
          description: Hent information om embedet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embede'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/embeder/{embedskode}:
    parameters:
    - $ref: '#/components/parameters/embedskodeParameter'
    get:
      tags:
      - retskreds
      operationId: getEmbedeV2
      summary: Hent embedet ud fra dets embedskode.
      responses:
        '200':
          description: Hent information om embedet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embedeV2'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /embeder/{embedskode}/naesteInstans:
    parameters:
    - $ref: '#/components/parameters/embedskodeParameter'
    - $ref: '#/components/parameters/sagsomraadeQueryParameter'
    get:
      deprecated: true
      tags:
      - retskreds
      operationId: findNaesteInstans
      summary: Hent embedet for næste instans ud fra dets embedskode og sagsområde.
        Dette endpoint er deprecated. Brug v2-udgaven.
      responses:
        '200':
          description: Information om embedet for næste instans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embede'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /v2/embeder/{embedskode}/naesteInstans:
    parameters:
    - $ref: '#/components/parameters/embedskodeParameter'
    - $ref: '#/components/parameters/sagsomraadeQueryParameter'
    get:
      tags:
      - retskreds
      operationId: findNaesteInstansV2
      summary: Hent embedet for næste instans ud fra dets embedskode og sagsområde.
      responses:
        '200':
          description: Information om embedet for næste instans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embedeV2'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /embeder/{embedskode}/forrigeInstanser:
    parameters:
    - $ref: '#/components/parameters/embedskodeParameter'
    - $ref: '#/components/parameters/sagsomraadeQueryParameter'
    get:
      tags:
      - retskreds
      operationId: findForrigeInstanser
      summary: Hent liste af forrige instans embeder for det angivne embede og sagsområde.
      responses:
        '200':
          description: Information om embederne for forrige instans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/embede'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /arrester:
    get:
      tags:
      - retskreds
      operationId: hentArrester
      summary: Hent informationer om alle arrester.
      responses:
        '200':
          description: Information om arrester hentet succesfuldt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/arrest'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /arrester/{arrestkode}:
    parameters:
    - $ref: '#/components/parameters/arrestkodeParameter'
    get:
      tags:
      - retskreds
      operationId: hentArrest
      summary: Hent informationer om specifik arrest ud fra dets arrestkode.
      responses:
        '200':
          description: Information om arresten hentet succesfuldt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/arrest'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /politikredse:
    parameters:
    - $ref: '#/components/parameters/landsretQueryParameter'
    - $ref: '#/components/parameters/politikredstypeQueryParameter'
    get:
      tags:
      - retskreds
      operationId: hentPolitikredse
      summary: Hent informationer om alle politikredse der passer en evt. filtreret
        søgning.
      responses:
        '200':
          description: Information om politikredse hentet succesfuldt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/politikreds'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /politikredse/{politikredskode}:
    parameters:
    - $ref: '#/components/parameters/politikredskodeParameter'
    get:
      tags:
      - retskreds
      operationId: hentPolitikreds
      summary: Hent informationer om specifik politikreds ud fra dets politikredskode.
      responses:
        '200':
          description: Information om politikredsen hentet succesfuldt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/politikreds'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /statsadvokaturer:
    parameters:
    - $ref: '#/components/parameters/landsretQueryParameter'
    get:
      tags:
      - retskreds
      operationId: hentStatsadvokaturer
      summary: Hent informationer om alle statsadvokaturer der passer en evt. filtreret
        søgning.
      responses:
        '200':
          description: Information om statsadvokaturer hentet succesfuldt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/statsadvokatur'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /statsadvokaturer/{statsadvokaturkode}:
    parameters:
    - $ref: '#/components/parameters/statsadvokaturkodeParameter'
    get:
      tags:
      - retskreds
      operationId: hentStatsadvokatur
      summary: Hent informationer om specifik statsadvokatur ud fra dets statsadvokaturkode.
      responses:
        '200':
          description: Information om statsadvokaturet hentet succesfuldt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statsadvokatur'
        default:
          $ref: '#/components/responses/genericErrorResponse'
security:
- bearerAuth: [
    ]
components:
  parameters:
    retskredsParameter:
      name: retskredsId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/retskredsId'
      description: Id på retskredsen.
    embedskodeParameter:
      name: embedskode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/embedskode'
      description: Id på retskredsen.
    arrestkodeParameter:
      name: arrestkode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/arrestkode'
      description: Unik kode for arresten.
    politikredskodeParameter:
      name: politikredskode
      in: path
      required: true
      schema:
        type: string
        example: 01 eller DUP
      description: Unik kode for politikredsen.
    statsadvokaturkodeParameter:
      name: statsadvokaturkode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/statsadvokaturkode'
      description: Unik kode for statsadvokaturet.
    landsretQueryParameter:
      name: landsret
      in: query
      required: false
      description: Angiver Landsret kontekst, så de returnerede værdier kun er dem
        der er relevante for den angivne Landsret.
      schema:
        $ref: '#/components/schemas/landsretEmbeder'
    politikredstypeQueryParameter:
      name: politikredstype
      in: query
      required: false
      description: Angiver hvilke politikredse, der ønskes returneret. Hvis ikke angivet,
        så vælges ALLE.
      schema:
        $ref: '#/components/schemas/politikredstype'
    retskredsQueryParameter:
      name: retskredsId
      in: query
      required: true
      description: Id på retskreds hvor hændelsen er relateret til.
      schema:
        $ref: '#/components/schemas/retskredsId'
    sagsomraadeQueryParameter:
      name: sagsomraade
      in: query
      required: true
      description: Sagsområde som hændelsen falder under.
      schema:
        $ref: '#/components/schemas/sagsomraadeEnum'
    instansniveauQueryParameter:
      name: instansniveau
      in: query
      required: true
      description: Instansniveau som embedet skal dække. Hvis ikke specificeret anvendes
        1 som default.
      schema:
        $ref: '#/components/schemas/instansniveauEnum'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    retskreds:
      properties:
        adresse:
          $ref: '#/components/schemas/danskAdresse'
        id:
          $ref: '#/components/schemas/retskredsId'
        navn:
          type: string
        telefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        hovedEmail:
          $ref: '#/components/schemas/email'
        skifteEmail:
          $ref: '#/components/schemas/email'
        embedskode:
          $ref: '#/components/schemas/embedskode'
        cvr:
          $ref: '#/components/schemas/cvrNummer'
        kontonummer:
          $ref: '#/components/schemas/kontonummer'
        bank:
          description: Navnet på retskredsens bank.
          type: string
          example: Danske Bank
      required: [
        ]
    retskredsV2:
      properties:
        adresse:
          $ref: '#/components/schemas/adresse'
        id:
          $ref: '#/components/schemas/retskredsId'
        navn:
          type: string
        telefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        hovedEmail:
          $ref: '#/components/schemas/email'
        skifteEmail:
          $ref: '#/components/schemas/email'
        embedskode:
          $ref: '#/components/schemas/embedskode'
        cvr:
          $ref: '#/components/schemas/cvrNummer'
        kontonummer:
          $ref: '#/components/schemas/kontonummer'
        bank:
          description: Navnet på retskredsens bank.
          type: string
          example: Danske Bank
      required: [
        ]
    embede:
      properties:
        adresse:
          $ref: '#/components/schemas/danskAdresse'
        embedskode:
          $ref: '#/components/schemas/embedskode'
        navn:
          type: string
        hovedTelefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        hovedEmail:
          $ref: '#/components/schemas/email'
        sagsomraadeKontaktoplysninger:
          $ref: '#/components/schemas/sagsomraadeKontaktoplysninger'
        cvr:
          $ref: '#/components/schemas/cvrNummer'
        kontonummer:
          $ref: '#/components/schemas/kontonummer'
        bank:
          description: Navnet på embedets bank.
          type: string
          example: Danske Bank
      required: [
        ]
    embedeV2:
      properties:
        retskredsId:
          $ref: '#/components/schemas/retskredsId'
        adresse:
          $ref: '#/components/schemas/adresse'
        embedskode:
          $ref: '#/components/schemas/embedskode'
        navn:
          type: string
        hovedTelefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        hovedEmail:
          $ref: '#/components/schemas/email'
        sagsomraadeKontaktoplysninger:
          $ref: '#/components/schemas/sagsomraadeKontaktoplysninger'
        cvr:
          $ref: '#/components/schemas/cvrNummer'
        kontonummer:
          $ref: '#/components/schemas/kontonummer'
        bank:
          description: Navnet på embedets bank.
          type: string
          example: Danske Bank
      required: [
        ]
    sagsomraadeEnum:
      type: string
      enum:
      - SKIFTE
      - STRAFFE
      - INSOLVENS
      - BOEDE
    instansniveauEnum:
      type: string
      enum:
      - INSTANSNIVEAU_1
      - INSTANSNIVEAU_2
      - INSTANSNIVEAU_3
    sagsomraadeKontaktoplysninger:
      description: Liste med kontaktoplysninger for hvert sagsområde der håndteres
        af embede.
      type: array
      items:
        $ref: '#/components/schemas/kontaktoplysningerForSagsomraade'
    kontaktoplysningerForSagsomraade:
      description: Kontaktoplysninger for et sagsområde håndteret af embedet.
      required:
      - sagsomraade
      - email
      properties:
        sagsomraade:
          $ref: '#/components/schemas/sagsomraadeEnum'
        email:
          $ref: '#/components/schemas/email'
        adresse:
          $ref: '#/components/schemas/danskAdresse'
        telefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        aabningstid:
          type: string
          description: Åbningstiden hvor embedet kan kontaktes.
          example: 8.30-15.00
        navn:
          type: string
    arrest:
      required:
      - arrestkode
      - navn
      properties:
        arrestkode:
          $ref: '#/components/schemas/arrestkode'
        navn:
          type: string
          example: Assens Arrest
    saerligPolitikredskode:
      description: Særlige politikredse som ikke opretholder samme formatkrav til
        journalnumre eller reelt politikreds-område.
      type: string
      enum:
      - NSK
      - FAUK
      - DUP
    politikreds:
      description: Angiver detaljer for politikreds. Afhængig af typen angives kun
        politikredskode eller særlig politikredskode.
      properties:
        type:
          $ref: '#/components/schemas/politikredstype'
        politikredskode:
          $ref: '#/components/schemas/politikredskode'
        saerligPolitikredskode:
          $ref: '#/components/schemas/saerligPolitikredskode'
        navn:
          type: string
          example: Københavns Politi
        telefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        email:
          $ref: '#/components/schemas/email'
        adresse:
          $ref: '#/components/schemas/adresse'
      required:
      - type
      - navn
      - telefonnummer
      - email
      - adresse
    statsadvokatur:
      properties:
        statsadvokaturkode:
          $ref: '#/components/schemas/statsadvokaturkode'
        navn:
          type: string
          example: Statsadvokaten i Viborg
        telefonnummer:
          $ref: '#/components/schemas/telefonnummer'
        email:
          $ref: '#/components/schemas/email'
        adresse:
          $ref: '#/components/schemas/adresse'
      required:
      - statsadvokaturkode
      - navn
      - telefonnummer
      - email
      - adresse
    landsretEmbeder:
      type: string
      enum:
      - OLR
      - VLR
    politikredstype:
      type: string
      enum:
      - GEOGRAFISK_POLITIKREDS
      - SAERLIG_POLITIKREDS
      - ALLE
    directionEnum:
      x-namespace: dk.domstol.oas.common
      type: string
      enum:
      - ASC
      - DESC
    id:
      type: string
      format: uuid
    cvrNummer:
      type: string
      pattern: ^[1-9][0-9]{7}$
    email:
      type: string
      format: email
      maxLength: 128
    retskredsId:
      description: Unikt ID for en given retskreds, der kan anvendes til identificering
        af en specifik retskreds i retskreds-service.
      type: string
      pattern: ^\d{4}$
    telefonnummer:
      type: string
      pattern: ^\+?\d*$
      maxLength: 20
    embedskode:
      description: Unik forkortelse for et givent embede, der kan anvendes til identificering
        af et specifik embede i retskreds-service.
      type: string
      pattern: ^[A-ZÆØÅ]{3}$
      maxLength: 3
      minLength: 3
    arrestkode:
      description: Unik forkortelse for en given arrest, der kan anvendes til identificering
        af en specifik arrest i retskreds-service.
      type: string
      pattern: ^[A-ZÆØÅ]{3}$
      maxLength: 3
      minLength: 3
    kontonummer:
      type: string
      pattern: ^\d{4}-\d{2,10}$
    politikredskode:
      x-namespace: dk.domstol.oas.common
      description: Normale politikredse - se saerligPolitikredskode for øvrige entiteter.
      type: string
      enum:
      - '01'
      - '02'
      - '03'
      - '04'
      - '05'
      - '06'
      - '07'
      - '08'
      - '09'
      - '10'
      - '11'
      - '12'
      - '13'
    statsadvokaturkode:
      description: Unik forkortelse for et givent statsadvokatur, der kan anvendes
        til identificering af et specifikt statsadvokatur i retskreds-service.
      type: string
      pattern: ^[A-ZÆØÅ]{3}$
      maxLength: 3
      minLength: 3
    apiError:
      x-namespace: dk.domstol.oas.common
      required:
      - code
      - status
      - message
      - path
      - timestamp
      properties:
        code:
          description: Human readable HTTP status message.
          type: integer
        status:
          description: HTTP status code.
          type: integer
        message:
          description: Message describing the error.
          type: string
        path:
          description: The path of the error.
          type: string
        timestamp:
          description: Date and time of the error.
          type: string
          format: date-time
        details:
          description: Detailed description of the error(s).
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/details'
        errorDetails:
          description: Detailed description of the error(s).
          type: array
          items:
            $ref: '#/components/schemas/details'
    details:
      required:
      - message
      properties:
        message:
          type: string
        code:
          type: string
    danskAdresse:
      deprecated: true
      x-namespace: dk.domstol.oas.common
      required:
      - adresselinje
      - postnummer
      - by
      properties:
        adresselinje:
          type: string
          maxLength: 255
        postnummer:
          type: string
          maxLength: 4
        by:
          type: string
          maxLength: 255
    landekodeEnum:
