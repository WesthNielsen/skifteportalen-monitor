openapi: 3.0.3
info:
  title: doedsbo
  description: Api til behandling af doedsbosager som ekstern.
  version: 3.2.0
servers:
- url: https://api.domstol.dk
- url: https://api.test-minskiftesag.net
security:
- bearerAuth: [
    ]
paths:
  /doedsbo/{sagId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentDoedsbosag
      summary: Hent en dødsbosag som en ekstern er tilknyttet.
      responses:
        '200':
          description: Hent information om en dødsbosag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/doedsbosag'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/afdoede:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentAfdoede
      summary: Henter informationer om afdøde.
      responses:
        '200':
          description: Hent information om afdøde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/afdoede'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/boetsVaretager:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentBoetsVaretager
      summary: Henter informationer om boets varetager.
      responses:
        '200':
          description: Informationer om boets varetager er hentet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/boetsVaretager'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/dokumentSamlinger:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentDokumenterSamlinger
      responses:
        '200':
          description: Alle dokumenter blev tilknyttet sagen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/dokumentSamling'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/boOplysninger:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentBoOplysninger
      summary: Henter boOplysninger på en given dødsbosag.
      responses:
        '200':
          description: BoOplysninger er hentet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/boOplysninger'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    post:
      tags:
      - doedsbo
      operationId: opdaterBoOplysninger
      summary: Opdater boOplysninger på en given dødsbosag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/boOplysninger'
      responses:
        '200':
          description: BoOplysninger er korrekt oprettet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/boOplysninger'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/skrivTilRetten:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - doedsbo
      operationId: skrivTilRetten
      summary: Skriv en meddelelse til retten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skrivTilRetten'
      responses:
        '201':
          description: Meddelelse er modtaget.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/skrivTilRetten:
    post:
      tags:
      - doedsbo
      operationId: skrivTilRettenUdenSag
      summary: Skriv en meddelelse til retten uden sag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/skrivTilRettenUdenSag'
      responses:
        '201':
          description: Meddelelse er modtaget.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/meddelelserFraEkstern:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentMeddelelserFraEkstern
      summary: Henter den eksterne brugers egne meddelelser til retten.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      responses:
        '200':
          description: Den eksterne brugers meddelelser til retten.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/meddelelseFraEkstern'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/meddelelserFraEkstern/{meddelelseId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - name: meddelelseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
    get:
      tags:
      - doedsbo
      operationId: hentMeddelelseFraEkstern
      summary: Henter en ekstern meddelelse til retten.
      responses:
        '200':
          description: Den eksterne meddelelse til retten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/meddelelseFraEkstern'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/sagsdeltagere:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    get:
      tags:
      - doedsbo
      operationId: hentSagsdeltagere
      summary: Henter alle sagsdeltagere som er relevate for brugeren.
      responses:
        '200':
          description: Sagsdeltagere er hentet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/rolle'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/haendelser:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    post:
      summary: Hent historikken, som består af hændelser.
      tags:
      - doedsbo
      operationId: hentHaendelser
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/direction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/haendelserQuery'
      responses:
        '200':
          description: Liste af hændelse som lever op til kriterierne.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/haendelse'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/totalCount'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    get:
      tags:
      - doedsbo
      operationId: hentBobehandling
      summary: Hent en bobehandling for et dødsbo.
      responses:
        '200':
          description: Hent information om en bobehandling for en dødsbosag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bobehandling'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/validation/formueoversigt:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    post:
      tags:
      - doedsbo
      operationId: validateFormueoversigt
      summary: Validerer en formueoversigt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/formueoversigtValidationRequest'
      responses:
        200:
          description: Formueoversigt er valideret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validationConclusions'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/validation/boudlaegOekonomi:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    post:
      tags:
      - doedsbo
      operationId: validateBoudlaegOekonomi
      summary: Validerer en boudlaegOekonomiopgoerelse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoudlaegOekonomiValidationRequest'
      responses:
        200:
          description: Formueoversigt er valideret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validationConclusions'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/skifteform/{skifteform}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    - $ref: '#/components/parameters/skifteform'
    get:
      tags:
      - doedsbo
      operationId: hentSkifteformInformationer.
      summary: Henter informationer nødvendigt for den ønskede skifteform.
      responses:
        200:
          description: Hentet oplysninger korrekt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skifteformInfo'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/anmodOmSkifteform:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    post:
      tags:
      - doedsbo
      operationId: anmodOmSkifteform
      summary: Anmoder om en skifteform for doedsbo.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/anmodning'
      responses:
        '200':
          description: Anmodning er modtaget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/anmodning'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/roller:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    get:
      tags:
      - doedsbo
      operationId: hentRoller
      summary: Henter brugerens roller på den givne doedsbosag.
      responses:
        '200':
          description: Brugeren har adgang til sagen og har modtaget sine roller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eksternRolle'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/handlinger:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    get:
      tags:
      - doedsbo
      operationId: hentMuligeHandlinger
      summary: Henter brugerens mulige handlinger på den givne doedsbosag.
      responses:
        '200':
          description: Brugeren har adgang til sagen og har modtaget sine mulige handlinger.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/eksternHandling'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/indgivFuldmagt:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - doedsbo
      operationId: indgivFuldmagt
      summary: Indgiver en digital fuldmagt.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/opretFuldmagt'
      responses:
        '200':
          description: Fuldmagt er modtaget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/opretFuldmagt'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/indsendAabningsstatus:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    post:
      tags:
      - doedsbo
      operationId: indsendAabningsstatus
      summary: Indsender en åbningsstatus.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/indsendAabningsstatus'
      responses:
        '200':
          description: Åbningsstatus er modtaget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/indsendAabningsstatus'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/indsendFormueoversigt:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    post:
      tags:
      - doedsbo
      operationId: indsendFormueoversigt
      summary: Indsender en formueoversigt.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/formueoversigt'
      responses:
        '201':
          description: Formueoversigt er modtaget.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/formueoversigt:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    get:
      tags:
      - doedsbo
      operationId: hentFormueoversigt
      summary: Henter formueoversigt for boet.
      responses:
        '200':
          description: Hent formueoversigt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/formueoversigt'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/indsendBoopgoerelse:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    post:
      tags:
      - doedsbo
      operationId: indsendBoopgoerelse
      summary: Indsender en boopgørelse.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/indsendBoopgoerelse'
      responses:
        '200':
          description: Boopgørelsen er modtaget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/indsendBoopgoerelse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/arvinger:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    get:
      tags:
      - doedsbo
      operationId: hentArvingerForBobehandling
      summary: Henter bekræftede arvinger for en given bobehandling.
      responses:
        '200':
          description: Bekræftede arvinger for bobehandling er hentet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/arving'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/fuldmagter/giver:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentAktuelGivenFuldmagt
      summary: Henter fuldmagter der ikke er tilbagetrukket.
      responses:
        '200':
          description: Fuldmagter er hentet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fuldmagt'
        '404':
          $ref: '#/components/responses/genericErrorResponse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/fuldmagter/haver:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentHavendeFuldmagter
      summary: Henter fuldmagter der er givet.
      responses:
        '200':
          description: Fuldmagter er hentet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/fuldmagt'
        '404':
          $ref: '#/components/responses/genericErrorResponse'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/frister:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    get:
      tags:
      - doedsbo
      operationId: hentFrister
      summary: Henter mine frister.
      responses:
        '200':
          description: Henter mine frister.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/frist'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/frister/{fristId}/data:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    - $ref: '#/components/parameters/fristId'
    get:
      tags:
      - doedsbo
      operationId: hentFristData
      summary: Henter relevant data for en frist.
      responses:
        '200':
          description: Henter relevant data for en frist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fristData'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/frister/{fristId}/godkendAnmodning:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    - $ref: '#/components/parameters/fristId'
    post:
      tags:
      - doedsbo
      operationId: godkendAnmodning
      summary: Godkender en anmodning om udlevering.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GodkendAnmodningOmUdlevering'
      responses:
        '200':
          description: Godkendelse modtaget og accepteret.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/mitCpr:
    parameters:
    - $ref: '#/components/parameters/sagId'
    get:
      tags:
      - doedsbo
      operationId: hentMitCpr
      summary: Henter Cpr på indlogget bruger.
      responses:
        '200':
          description: Cpr er hentet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mitCpr'
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/tinglys:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - doedsbo
      operationId: anmodOmTinglysning
      summary: Anmoder om tinglysning.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tinglysningAnmodning'
      responses:
        '200':
          description: Anmodning er modtaget.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/bobehandlinger/{bobehandlingId}/kladde/{eksternHandling}:
    parameters:
    - $ref: '#/components/parameters/sagId'
    - $ref: '#/components/parameters/bobehandlingId'
    - $ref: '#/components/parameters/eksternHandling'
    get:
      tags:
      - doedsbo
      operationId: hentKladde
      summary: Henter kladde.
      responses:
        '200':
          description: Henter kladde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kladde'
        default:
          $ref: '#/components/responses/genericErrorResponse'
    post:
      tags:
      - doedsbo
      operationId: opretEllerOpdaterKladde
      summary: Opretter eller opdaterer kladde.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kladde'
      responses:
        '200':
          description: Kladde er oprettet eller opdaterert.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/book-vejledningsmoede:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - doedsbo
      operationId: bookVejledningsmoede
      summary: Booker et vejledningsmøde.
      responses:
        '200':
          description: Vejledningsmøde er booket.
        default:
          $ref: '#/components/responses/genericErrorResponse'
  /doedsbo/{sagId}/fravaelg-vejledningsmoede:
    parameters:
    - $ref: '#/components/parameters/sagId'
    post:
      tags:
      - doedsbo
      operationId: fravaelgVejledningsmoede
      summary: Fravælger vejledningsmøde. Hvilket resulterer i at introduktionen ikke
        bliver vist ved login.
      responses:
        '200':
          description: Vejledningsmøde er fravalgt.
        default:
          $ref: '#/components/responses/genericErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    eksternHandling:
      name: eksternHandling
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/eksternHandling'
    fristId:
      name: fristId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
    page:
      name: page
      description: Side for paginering.
      required: false
      in: query
      schema:
        type: integer
    size:
      name: size
      description: Antal elementer pr. side.
      required: false
      in: query
      schema:
        type: integer
    sort:
      name: sort
      description: Liste af felter der skal sorteres på.
      required: false
      in: query
      schema:
        type: array
        items:
          type: string
    direction:
      name: direction
      description: Stigende eller faldende retning for søgeresultater.
      in: query
      schema:
        $ref: '#/components/schemas/directionEnum'
    sagId:
      name: sagId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
      description: Id på dødsbosag.
    bobehandlingId:
      name: bobehandlingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/id'
      description: Id på en bobehandling til en dødsbosag.
    skifteform:
      name: skifteform
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/skifteform'
      description: Skifteform som kontaktpersonen anmoder om.
  schemas:
    kladde:
      type: object
      properties:
        content:
          type: string
    opretFuldmagt:
      type: object
      properties:
